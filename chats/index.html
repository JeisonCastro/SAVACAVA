<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat IA | AUVRO</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#06090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06090f;--bg2:#0d1117;--surface:#161e2a;--border:#1e2d40;--border2:#253648;
  --accent:#0ea5e9;--accent2:#38bdf8;--text:#e8f0f8;--muted:#7a98b8;--dim:#4a6580;
  --chat-bg:#0b141d;--chat-panel:#111b24;--bubble-user:#1c2c3f;--bubble-ai:#0b3a4d;
  --red:#f87171;
}
body.light-mode{
  --bg:#eef4f8;--bg2:#ffffff;--surface:#ffffff;--border:#d9e6ef;
  --accent:#0284c7;--accent2:#0ea5e9;--text:#0f172a;--muted:#475569;--dim:#7890a4;
  --chat-bg:#e7f0f4;--chat-panel:#f7fbfd;--bubble-user:#ffffff;--bubble-ai:#dff3ff;--red:#dc2626;
}
html{height:100%}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:12px 16px;padding-top:calc(env(safe-area-inset-top, 0px) + 12px);
  background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;
}
.logo-row{display:flex;align-items:center;gap:8px;min-width:0}
.logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;letter-spacing:.04em;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px}
#user-email{color:var(--muted);font-size:.8rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:.8rem;padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
main{flex:1 1 auto;overflow-y:auto;background:var(--chat-bg);padding:20px 16px 8px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.msg{display:flex;flex-direction:column;max-width:85%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.msg.error{max-width:100%;align-self:center;align-items:center}
.bubble{
  padding:10px 14px;border-radius:16px;line-height:1.55;font-size:.95rem;word-break:break-word;
  white-space:normal;
}
.msg.user .bubble{background:var(--bubble-user);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg.ai .bubble{background:var(--bubble-ai);border-bottom-left-radius:4px}
.msg.error .bubble{background:rgba(248,113,113,.12);border:1px solid var(--red);color:var(--red);font-size:.85rem}
.bubble ul{margin:4px 0 4px 18px}
.bubble a{color:var(--accent2);text-decoration:underline}
.bubble p{margin:0}
.time{font-size:.7rem;color:var(--dim);margin-top:4px;padding:0 4px}
.typing{display:flex;gap:5px;padding:6px 4px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.welcome{text-align:center;color:var(--muted);margin:auto;max-width:520px;padding:24px}
.welcome h2{font-family:'Syne',sans-serif;font-weight:700;color:var(--text);font-size:1.4rem;margin-bottom:8px}
footer{
  flex:0 0 auto;padding:12px 16px;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 12px);
  background:var(--surface);border-top:1px solid var(--border);
}
.composer{
  max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:8px;
}
.composer:focus-within{border-color:var(--accent)}
#chat-input{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:.95rem;resize:none;max-height:160px;padding:6px 4px;line-height:1.5;
}
#chat-input::placeholder{color:var(--dim)}
#send-btn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
#send-btn:hover{background:var(--accent2)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:.85rem;box-shadow:0 12px 40px rgba(0,0,0,.4);
  display:none;z-index:50;max-width:90vw;text-align:center;
}
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <span class="logo-dot"></span>
    <span class="logo-text">AUVRO CHAT</span>
  </div>
  <div class="header-right">
    <span id="user-email"></span>
    <button class="btn" id="nuevo-btn" title="Nueva conversación">Nuevo</button>
    <button class="btn" id="salir-btn">Salir</button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="wrap"></div>
</main>

<footer>
  <div class="composer">
    <textarea id="chat-input" rows="1" placeholder="Escribe tu mensaje... (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
    <button id="send-btn" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>
    </button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  URL: "https://zsxkfqnalkfvwjrzuqip.supabase.co",
  ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzeGtmcW5hbGtmdndqcnp1cWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDgyODMsImV4cCI6MjA5MjAyNDI4M30.R4j23l3IHEL966VupeR-Sx_KtDQzB8NzfJtEVDGewGs"
};
const _supabase = supabase.createClient(CONFIG.URL, CONFIG.ANON_KEY);

const AGENTE_ID = new URLSearchParams(window.location.search).get('agente') || '1';
const LOGIN_URL = '/login.html?redirect=' + encodeURIComponent('/chats/');

const wrap = document.getElementById('wrap');
const main = document.getElementById('main');
const input = document.getElementById('chat-input');
const toast = document.getElementById('toast');

let sesion = null;
let conversationId = null;
let enviando = false;

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmt(s) {
  let out = esc(s);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const lines = out.split('\n');
  const html = [];
  let ul = false;
  for (const line of lines) {
    const bullet = line.match(/^[-•]\s+(.*)$/);
    if (bullet) {
      if (!ul) { html.push('<ul>'); ul = true; }
      html.push('<li>' + bullet[1] + '</li>');
    } else {
      if (ul) { html.push('</ul>'); ul = false; }
      html.push(line);
    }
  }
  if (ul) html.push('</ul>');
  return html.join('<br>');
}

function addMsg(text, tipo, rawHtml) {
  const div = document.createElement('div');
  div.className = 'msg ' + (tipo === 'user' ? 'user' : 'ai');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = rawHtml ? text : fmt(text);
  div.appendChild(bubble);
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.appendChild(time);
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(bubble);
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

function mostrarBienvenida() {
  wrap.innerHTML = '';
  const w = document.createElement('div');
  w.className = 'welcome';
  w.innerHTML = '<h2>Bienvenido a tu asistente</h2><p>Pregúntame lo que necesites. Tus conversaciones quedan guardadas en tu cuenta.</p>';
  wrap.appendChild(w);
}

async function cargarHistorial() {
  try {
    const res = await fetch('/.netlify/functions/web-chat-messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ agente_id: AGENTE_ID, external_user_id: sesion.user.id })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) return cerrarSesion();
    if (res.status === 403) { wrap.innerHTML = ''; return; }
    if (data.conversation) conversationId = data.conversation.id;
    const msgs = data.messages || [];
    if (!msgs.length) { mostrarBienvenida(); return; }
    wrap.innerHTML = '';
    for (const m of msgs) {
      const content = m.content || '';
      if (m.role === 'user' || m.role === 'human') addMsg(content, 'user');
      else if (m.role === 'assistant' || m.role === 'bot' || m.role === 'system') addMsg(content, 'ai');
    }
    main.scrollTop = main.scrollHeight;
  } catch (e) {
    mostrarBienvenida();
  }
}

async function enviar() {
  const text = input.value.trim();
  if (!text || enviando) return;
  input.value = '';
  autoGrow();
  addMsg(text, 'user');
  addTyping();
  enviando = true;
  setSendState();
  try {
    const payload = { prompt: text, agente_id: AGENTE_ID, canal: 'web', external_user_id: sesion.user.id };
    if (conversationId) payload.conversation_id = conversationId;
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    removeTyping();
    if (res.status === 401) return cerrarSesion('Tu sesión expiró. Inicia sesión de nuevo.');
    if (res.status === 403) { addMsg('No tienes acceso a esta conversación.', 'error'); return; }
    if (data.conversation_id) conversationId = data.conversation_id;
    if (data.skipped === true || data.modo_humano === true) {
      addMsg(data.respuesta || 'Tu mensaje fue recibido. Un asesor humano continuará la conversación.', 'ai');
    } else if (data.respuesta) {
      addMsg(data.respuesta, 'ai');
    } else if (data.error) {
      addMsg('Error: ' + data.error, 'error');
    }
  } catch (e) {
    removeTyping();
    addMsg('Error de conexión. Intenta de nuevo.', 'error');
  } finally {
    enviando = false;
    setSendState();
  }
}

function nuevaConversacion() {
  conversationId = null;
  mostrarBienvenida();
}

async function cerrarSesion(msg) {
  await _supabase.auth.signOut();
  window.location.href = LOGIN_URL;
}

function setSendState() {
  document.getElementById('send-btn').disabled = enviando;
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviar();
  }
});
document.getElementById('send-btn').addEventListener('click', enviar);
document.getElementById('nuevo-btn').addEventListener('click', nuevaConversacion);
document.getElementById('salir-btn').addEventListener('click', () => cerrarSesion());

(async function init() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = LOGIN_URL; return; }
  const { data: { user }, error } = await _supabase.auth.getUser(session.access_token);
  if (error || !user) { window.location.href = LOGIN_URL; return; }
  sesion = session;
  document.getElementById('user-email').textContent = user.email;
  cargarHistorial();
})();
</script>
</body>
</html>
