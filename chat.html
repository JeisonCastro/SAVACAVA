<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Tokens de color (dark/light) provienen de auvro-design.css (estandar compartido con el dashboard). */
html{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
  background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;z-index:10;
}
.back-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:var(--bg);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;text-decoration:none;transition:all .2s;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.agent-avatar{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;
  background:rgba(14,165,233,.12);border:1px solid rgba(14,165,233,.24);color:var(--accent);
  font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:800;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;text-transform:uppercase;
}
.title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
#agent-name{font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:800;font-size:.95rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto}
.status-dot.offline{background:var(--dim)}
.header-right{display:flex;align-items:center;gap:8px}
#user-email{color:var(--muted);font-size:.75rem;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-small{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;
  border:1px solid var(--border2);background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:.76rem;font-weight:500;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.btn-small:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn-small svg{width:15px;height:15px;flex:0 0 auto}

/* ── MESSAGES ───────────────────────────────────────────────────────────── */
main{
  flex:1 1 auto;overflow-y:auto;padding:18px 14px 10px;scroll-behavior:smooth;
  overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
  background:var(--chat-panel);
}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:14px}
.msg{display:flex;flex-direction:column;max-width:min(72%,680px);animation:msgFadeIn .22s ease}
@keyframes msgFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:10px 12px;border-radius:14px;line-height:1.55;font-size:.9rem;word-break:break-word;
  box-shadow:0 1px 3px rgba(16,24,40,.08);position:relative;
}
.msg-role{
  display:block;font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:.25rem;
}
.msg-text{display:block}
.msg.user .bubble{background:var(--bubble-user);border:1px solid var(--border);border-bottom-right-radius:5px}
.msg.ai .bubble{background:var(--bubble-ai);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.error{max-width:92%;align-self:center;align-items:center}
.msg.error .bubble{
  background:#fefce8;border:1px solid #fde68a;color:var(--yellow);
  font-size:.8rem;text-align:center;box-shadow:none;
}
.msg.error .msg-role{display:none}
.bubble ul{margin:4px 0 4px 18px}
.bubble a{color:var(--accent2);text-decoration:underline}
.bubble img.adjunta{max-width:220px;border-radius:10px;display:block;margin:4px 0 6px;border:1px solid var(--border)}
.time{font-size:.64rem;color:var(--dim);margin-top:5px;padding:0 4px}
.date-chip{align-self:center;font-size:.68rem;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:999px}
.typing{display:flex;gap:5px;padding:8px 4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite;opacity:.3}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center;gap:6px;padding:2rem;color:var(--dim)}
.empty-state .empty-icon{
  width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--accent);
}
.empty-state .empty-title{font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:700;font-size:1rem;color:var(--text)}
.empty-state .empty-sub{font-size:.85rem;max-width:340px;line-height:1.5}

/* ── IMAGE PREVIEW ──────────────────────────────────────────────────────── */
.image-preview{flex:0 0 auto;display:none;justify-content:center;padding:6px 16px;background:var(--surface);border-top:1px solid var(--border)}
.image-preview.visible{display:flex}
.image-preview .chip{
  display:inline-flex;align-items:center;gap:10px;max-width:100%;
  padding:6px 12px 6px 6px;border-radius:999px;
  background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.18);
}
.image-preview img{width:34px;height:34px;object-fit:cover;border-radius:50%;border:1px solid var(--border2)}
.image-preview .name{font-size:.78rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.image-preview .remove{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:2px 4px;line-height:1}
.image-preview .remove:hover{color:var(--red)}

/* ── COMPOSER ───────────────────────────────────────────────────────────── */
footer{
  flex:0 0 auto;padding:10px 16px;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  background:var(--surface);border-top:1px solid var(--border);
}
.composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.composer-icon-btn{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--border2);background:var(--bg);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex:0 0 auto;
}
.composer-icon-btn:hover{border-color:var(--accent);color:var(--accent)}
#chat-input{
  flex:1;min-height:44px;max-height:118px;padding:12px 14px;background:var(--bg);
  border:1px solid var(--border2);border-radius:14px;color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:.9rem;resize:none;outline:none;line-height:1.5;
}
#chat-input:focus{border-color:var(--accent)}
#chat-input::placeholder{color:var(--dim)}
#send-btn{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
  box-shadow:0 4px 14px rgba(14,165,233,.3);
}
#send-btn:hover{background:var(--accent2);transform:translateY(-1px)}
#send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ── TOAST ──────────────────────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:.84rem;box-shadow:0 12px 40px rgba(0,0,0,.35);
  display:none;z-index:50;max-width:90vw;text-align:center;
}

/* ── CATALOG PANEL ──────────────────────────────────────────────────────── */
.catalog-panel{
  flex:0 0 auto;display:none;flex-direction:column;background:var(--surface);
  border-top:1px solid var(--border);padding:10px 16px;gap:8px;
}
.catalog-panel.visible{display:flex}
.catalog-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
}
.catalog-close{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;line-height:1;padding:2px}
.catalog-close:hover{color:var(--red)}
.catalog-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.catalog-strip::-webkit-scrollbar{height:6px}
.catalog-strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px}
.product-card{
  flex:0 0 190px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px;
  display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;
  transition:border-color .2s, transform .2s, box-shadow .2s;
}
.product-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.product-card .pc-img{
  width:100%;height:74px;border-radius:10px;object-fit:cover;
  background:var(--chat-panel);display:flex;align-items:center;justify-content:center;color:var(--dim);
}
.product-card .pc-name{font-size:.8rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .pc-cat{font-size:.66rem;color:var(--dim);text-transform:capitalize}
.product-card .pc-price{font-size:.74rem;color:var(--accent);font-weight:700;line-height:1.35}
.product-card .pc-cta{margin-top:auto;font-size:.7rem;font-weight:700;color:var(--accent)}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmt(s) {
  let out = esc(s);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const lines = out.split('\n');
  const html = [];
  let ul = false;
  for (const line of lines) {
    const bullet = line.match(/^[-•]\s+(.*)$/);
    if (bullet) {
      if (!ul) { html.push('<ul>'); ul = true; }
      html.push('<li>' + bullet[1] + '</li>');
    } else {
      if (ul) { html.push('</ul>'); ul = false; }
      html.push(line);
    }
  }
  if (ul) html.push('</ul>');
  return html.join('<br>');
}

function hora(value) {
  try { return new Date(value || Date.now()).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; }
}
function dia(value) {
  try { return new Date(value || Date.now()).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' }); } catch (_) { return ''; }
}

function fmtCop(cents) {
  return '$' + Math.round((Number(cents) || 0) / 100).toLocaleString('es-CO');
}

function resumenCard(p) {
  if (p.tipo === 'tour' && (p.categorias_pasajero || []).length) {
    const precios = p.categorias_pasajero.map(b => b.precio_cents || 0);
    return 'Desde ' + fmtCop(Math.min(...precios)) + ' / persona';
  }
  if ((p.variantes || []).length) {
    return p.variantes.slice(0, 2).map(v => v.nombre + ' ' + fmtCop(v.precio_cents)).join(' · ');
  }
  return fmtCop(p.precio_cents);
}

function setCatalogo(lista) {
  catalogo = Array.isArray(lista) ? lista : [];
  document.getElementById('catalog-btn').style.display = catalogo.length ? '' : 'none';
  renderCatalogoStrip();
}

function renderCatalogoStrip() {
  const strip = document.getElementById('catalog-strip');
  if (!catalogo.length) {
    strip.innerHTML = '<div style="font-size:.78rem;color:var(--dim);padding:6px 0;">Sin productos disponibles.</div>';
    return;
  }
  strip.innerHTML = catalogo.map((p, i) => {
    const img = p.url_imagen
      ? '<img class="pc-img" src="' + esc(p.url_imagen) + '" alt="" onerror="this.style.display=\'none\'">'
      : '<div class="pc-img"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>';
    const cat = esc(p.categoria || (p.tipo ? p.tipo : ''));
    return '' +
      '<div class="product-card" onclick="elegirProducto(' + i + ')" title="' + esc(p.nombre) + '">' +
        img +
        '<div class="pc-name">' + esc(p.nombre) + '</div>' +
        '<div class="pc-cat">' + cat + '</div>' +
        '<div class="pc-price">' + esc(resumenCard(p)) + '</div>' +
        '<div class="pc-cta">Pedir &rarr;</div>' +
      '</div>';
  }).join('');
}

function elegirProducto(i) {
  const p = catalogo[i];
  if (!p) return;
  input.value = 'Quiero comprar: ' + p.nombre;
  input.focus();
  autoGrow();
  enviar();
}

function addMsg(text, tipo, time, imagen) {
  const div = document.createElement('div');
  div.className = 'msg ' + (tipo === 'user' ? 'user' : 'ai');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const label = document.createElement('span');
  label.className = 'msg-role';
  label.textContent = (tipo === 'user') ? 'Tú' : AGENTE_NOMBRE;
  bubble.appendChild(label);
  const body = document.createElement('span');
  body.className = 'msg-text';
  let html = fmt(text);
  if (imagen) html = '<img class="adjunta" src="' + imagen + '" alt="Imagen adjunta">' + (html ? '<br>' + html : '');
  body.innerHTML = html;
  bubble.appendChild(body);
  div.appendChild(bubble);
  if (time) {
    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = hora(time);
    div.appendChild(t);
  }
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function addTyping() {
  removeTyping();
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(bubble);
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

function toggleTheme() {
  const claro = document.body.classList.toggle('light-mode');
  try { localStorage.setItem('auvrouter_theme', claro ? 'light' : 'dark'); } catch (_) {}
}

function setStatus(text) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').classList.toggle('offline', text === 'Sin conexión');
}

function estadoVacio() {
  wrap.innerHTML = '';
  const w = document.createElement('div');
  w.className = 'empty-state';
  w.innerHTML =
    '<div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>' +
    '<div class="empty-title">Conectado a ' + esc(AGENTE_NOMBRE) + '</div>' +
    '<div class="empty-sub">Escribe un mensaje o adjunta una imagen para comenzar. Tu conversación se guarda automáticamente.</div>';
  wrap.appendChild(w);
}

async function cargarHistorial() {
  try {
    const res = await fetch('/.netlify/functions/web-chat-messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ agente_id: AGENTE_ID, external_user_id: sesion.user.id, canal: CANAL })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) return cerrarSesion();
    if (!res.ok || data.error) {
      setStatus('Sin conexión');
      estadoVacio();
      return;
    }
    setStatus('En línea');
    if (Array.isArray(data.productos)) setCatalogo(data.productos);
    if (data.conversation) conversationId = data.conversation.id;
    const msgs = data.messages || [];
    if (!msgs.length) { estadoVacio(); return; }
    wrap.innerHTML = '';
    let ultimoDia = '';
    for (const m of msgs) {
      const d = dia(m.created_at);
      if (d && d !== ultimoDia) {
        ultimoDia = d;
        const chip = document.createElement('div');
        chip.className = 'date-chip';
        chip.textContent = d;
        wrap.appendChild(chip);
      }
      const content = m.content || '';
      let imgUrl = null;
      try {
        const meta = typeof m.metadata === 'string' ? JSON.parse(m.metadata) : (m.metadata || {});
        if (meta.image_url && typeof meta.image_url === 'string') imgUrl = meta.image_url;
      } catch (_) {}
      if (m.role === 'user' || m.role === 'human') addMsg(content, 'user', m.created_at, imgUrl);
      else if (m.role === 'assistant' || m.role === 'bot' || m.role === 'system') addMsg(content, 'ai', m.created_at, imgUrl);
    }
    main.scrollTop = main.scrollHeight;
  } catch (e) {
    estadoVacio();
  }
}

async function enviar() {
  const text = input.value.trim();
  const hasImage = !!pendingImage;
  if ((!text && !hasImage) || enviando) return;

  input.value = '';
  autoGrow();
  const imageDataUrl = hasImage ? pendingImage.dataUrl : null;
  pendingImage = null;
  imagePreview.classList.remove('visible');
  fileInput.value = '';

  addMsg(text || '📷 Imagen', 'user', new Date().toISOString(), imageDataUrl);
  addTyping();
  enviando = true;
  setSendState();

  try {
    const payload = {
      prompt: text || 'Describe esta imagen',
      agente_id: AGENTE_ID,
      canal: CANAL,
      external_user_id: sesion.user.id
    };
    if (conversationId) payload.conversation_id = conversationId;
    if (imageDataUrl) payload.image_url = imageDataUrl;

    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    removeTyping();

    if (res.status === 401) return cerrarSesion('Tu sesión expiró. Inicia sesión de nuevo.');
    if (res.status === 403) { addMsg('No tienes acceso a esta conversación.', 'ai'); return; }

    if (Array.isArray(data.productos)) setCatalogo(data.productos);
    if (data.conversation_id) conversationId = data.conversation_id;

    if (data.skipped === true || data.modo_humano === true) {
      addMsg(data.respuesta || 'Tu mensaje fue recibido. Un asesor humano continuará la conversación.', 'ai', new Date().toISOString());
    } else if (res.ok && data.respuesta) {
      addMsg(data.respuesta, 'ai', new Date().toISOString());
    } else if (data.error || !res.ok) {
      addMsg(data.respuesta || data.error || ('Error del servidor (' + res.status + ')'), 'ai');
    }
  } catch (e) {
    removeTyping();
    addMsg('Error de conexión. Intenta de nuevo.', 'ai');
  } finally {
    enviando = false;
    setSendState();
  }
}

function nuevaConversacion() {
  conversationId = null;
  estadoVacio();
}

async function cerrarSesion(msg) {
  if (msg) showToast(msg);
  await _supabase.auth.signOut();
  window.location.href = LOGIN_URL;
}

function setSendState() {
  document.getElementById('send-btn').disabled = enviando;
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 118) + 'px';
}

document.getElementById('attach-btn').addEventListener('click', () => fileInput.click());

document.getElementById('catalog-btn').addEventListener('click', () => {
  const panel = document.getElementById('catalog-panel');
  const show = !panel.classList.contains('visible');
  panel.classList.toggle('visible', show);
  if (show) renderCatalogoStrip();
});
document.getElementById('catalog-close').addEventListener('click', () => {
  document.getElementById('catalog-panel').classList.remove('visible');
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    fileInput.value = '';
    showToast('Solo se permiten imágenes.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    fileInput.value = '';
    showToast('La imagen supera 10 MB.');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = { dataUrl: reader.result, name: file.name };
    imageThumb.src = reader.result;
    imageName.textContent = file.name;
    imagePreview.classList.add('visible');
  };
  reader.readAsDataURL(file);
});

imageRemove.addEventListener('click', () => {
  pendingImage = null;
  fileInput.value = '';
  imagePreview.classList.remove('visible');
});

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviar();
  }
});
document.getElementById('send-btn').addEventListener('click', enviar);
document.getElementById('nuevo-btn').addEventListener('click', nuevaConversacion);
document.getElementById('salir-btn').addEventListener('click', () => cerrarSesion());

(async function init() {
  if (!AGENTE_ID) {
    wrap.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'msg error';
    w.innerHTML = '<div class="bubble"><span class="msg-role"></span>Falta el agente a probar. <a href="dashboard.html">Volver al dashboard</a></div>';
    wrap.appendChild(w);
    return;
  }
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = LOGIN_URL; return; }
  const { data: { user }, error } = await _supabase.auth.getUser(session.access_token);
  if (error || !user) { window.location.href = LOGIN_URL; return; }
  sesion = session;
  document.getElementById('user-email').textContent = user.email;
  cargarHistorial();
})();
</script>
</body>
