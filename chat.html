<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat de prueba | AUVRO</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#06090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06090f;--bg2:#0d1117;--surface:#161e2a;--border:#1e2d40;--border2:#253648;
  --accent:#0ea5e9;--accent2:#38bdf8;--text:#e8f0f8;--muted:#7a98b8;--dim:#4a6580;
  --chat-bg:#0b141d;--chat-panel:#111b24;--bubble-user:#1c2c3f;--bubble-ai:#0b3a4d;
  --red:#f87171;--green:#22d3a5;
}
body.light-mode{
  --bg:#eef4f8;--bg2:#ffffff;--surface:#ffffff;--border:#d9e6ef;
  --accent:#0284c7;--accent2:#0ea5e9;--text:#0f172a;--muted:#475569;--dim:#7890a4;
  --chat-bg:#e7f0f4;--chat-panel:#f7fbfd;--bubble-user:#ffffff;--bubble-ai:#dff3ff;--red:#dc2626;
}
html{height:100%}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
header{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
  background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;z-index:10;
}
.back-btn{
  background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;text-decoration:none;transition:.15s;
}
.back-btn:hover{color:var(--text);border-color:var(--accent)}
.title-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#agent-name{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,211,165,.12);flex:0 0 auto}
.header-right{display:flex;align-items:center;gap:8px}
.btn{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:.8rem;padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
main{flex:1 1 auto;overflow-y:auto;background:var(--chat-bg);padding:18px 14px 8px;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:14px}
.msg{display:flex;flex-direction:column;max-width:85%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 14px;border-radius:16px;line-height:1.55;font-size:.95rem;word-break:break-word}
.msg.user .bubble{background:var(--bubble-user);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg.ai .bubble{background:var(--bubble-ai);border-bottom-left-radius:4px}
.msg.error{max-width:100%;align-self:center;align-items:center}
.msg.error .bubble{background:rgba(248,113,113,.12);border:1px solid var(--red);color:var(--red);font-size:.85rem;text-align:center}
.bubble ul{margin:4px 0 4px 18px}
.bubble a{color:var(--accent2);text-decoration:underline}
.bubble img.adjunta{max-width:220px;border-radius:10px;display:block;margin:4px 0}
.time{font-size:.7rem;color:var(--dim);margin-top:4px;padding:0 4px}
.date-chip{align-self:center;font-size:.7rem;color:var(--muted);background:rgba(15,23,42,.82);border:1px solid var(--border);padding:3px 10px;border-radius:999px}
.typing{display:flex;gap:5px;padding:6px 4px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.image-preview{
  flex:0 0 auto;display:none;align-items:center;gap:10px;
  padding:8px 16px;background:var(--surface);border-top:1px solid var(--border);
}
.image-preview.visible{display:flex}
.image-preview img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--border2)}
.image-preview .name{flex:1;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.image-preview .remove{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px}
.image-preview .remove:hover{color:var(--red)}
footer{
  flex:0 0 auto;padding:10px 14px;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  background:var(--surface);border-top:1px solid var(--border);
}
.composer{
  max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:8px;
}
.composer:focus-within{border-color:var(--accent)}
.attach-btn{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.attach-btn:hover{color:var(--accent)}
#chat-input{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:.95rem;resize:none;max-height:150px;padding:8px 4px;line-height:1.5;
}
#chat-input::placeholder{color:var(--dim)}
#send-btn{
  flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:none;background:var(--accent);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
#send-btn:hover{background:var(--accent2)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:.85rem;box-shadow:0 12px 40px rgba(0,0,0,.4);
  display:none;z-index:50;max-width:90vw;text-align:center;
}
@media(max-width:520px){
  .msg{max-width:92%}
}
</style>
</head>
<body>

<header>
  <a class="back-btn" href="dashboard.html" title="Volver al dashboard" aria-label="Volver">&larr;</a>
  <div class="title-wrap">
    <div id="agent-name">Chat de prueba</div>
    <div class="header-sub"><span class="status-dot"></span><span id="status-text">En línea</span></div>
  </div>
  <div class="header-right">
    <span id="user-email" style="color:var(--muted);font-size:.75rem;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <button class="btn" id="nuevo-btn" title="Nueva conversación">Nuevo</button>
    <button class="btn" id="salir-btn">Salir</button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="wrap"></div>
</main>

<div class="image-preview" id="image-preview">
  <img id="image-thumb" src="" alt="Preview">
  <span class="name" id="image-name"></span>
  <button class="remove" id="image-remove" type="button" aria-label="Quitar imagen">&times;</button>
</div>

<footer>
  <div class="composer">
    <input type="file" id="file-input" accept="image/*" style="display:none">
    <button class="attach-btn" id="attach-btn" type="button" title="Adjuntar imagen" aria-label="Adjuntar imagen">📎</button>
    <textarea id="chat-input" rows="1" placeholder="Escribe un mensaje... (Enter para enviar, Shift+Enter para salto de línea)"></textarea>
    <button id="send-btn" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>
    </button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  URL: "https://zsxkfqnalkfvwjrzuqip.supabase.co",
  ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzeGtmcW5hbGtmdndqcnp1cWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDgyODMsImV4cCI6MjA5MjAyNDI4M30.R4j23l3IHEL966VupeR-Sx_KtDQzB8NzfJtEVDGewGs"
};
const _supabase = supabase.createClient(CONFIG.URL, CONFIG.ANON_KEY);

const CANAL = 'dashboard';
const params = new URLSearchParams(window.location.search);
const AGENTE_ID = (params.get('agente') || '').trim();
const AGENTE_NOMBRE = params.get('nombre') || 'Chat de prueba';
const LOGIN_URL = '/login.html?redirect=' + encodeURIComponent('/chat.html' + window.location.search);

const wrap = document.getElementById('wrap');
const main = document.getElementById('main');
const input = document.getElementById('chat-input');
const toast = document.getElementById('toast');
const imagePreview = document.getElementById('image-preview');
const imageThumb = document.getElementById('image-thumb');
const imageName = document.getElementById('image-name');
const imageRemove = document.getElementById('image-remove');
const fileInput = document.getElementById('file-input');

let sesion = null;
let conversationId = null;
let enviando = false;
let pendingImage = null;

document.getElementById('agent-name').textContent = AGENTE_NOMBRE;

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmt(s) {
  let out = esc(s);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const lines = out.split('\n');
  const html = [];
  let ul = false;
  for (const line of lines) {
    const bullet = line.match(/^[-•]\s+(.*)$/);
    if (bullet) {
      if (!ul) { html.push('<ul>'); ul = true; }
      html.push('<li>' + bullet[1] + '</li>');
    } else {
      if (ul) { html.push('</ul>'); ul = false; }
      html.push(line);
    }
  }
  if (ul) html.push('</ul>');
  return html.join('<br>');
}

function hora(value) {
  try { return new Date(value || Date.now()).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; }
}
function dia(value) {
  try { return new Date(value || Date.now()).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' }); } catch (_) { return ''; }
}

function addMsg(text, tipo, time, imagen) {
  const div = document.createElement('div');
  div.className = 'msg ' + (tipo === 'user' ? 'user' : 'ai');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  let html = fmt(text);
  if (imagen) html = '<img class="adjunta" src="' + imagen + '" alt="Imagen adjunta">' + (html ? '<br>' + html : '');
  bubble.innerHTML = html;
  div.appendChild(bubble);
  if (time) {
    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = hora(time);
    div.appendChild(t);
  }
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function addTyping() {
  removeTyping();
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(bubble);
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

function setStatus(text) {
  document.getElementById('status-text').textContent = text;
}

function estadoVacio() {
  wrap.innerHTML = '';
  const w = document.createElement('div');
  w.className = 'msg error';
  w.innerHTML = '<div class="bubble">Conectado al agente. Listo para recibir instrucciones. Puedes adjuntar imágenes.</div>';
  wrap.appendChild(w);
}

async function cargarHistorial() {
  try {
    const res = await fetch('/.netlify/functions/web-chat-messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ agente_id: AGENTE_ID, external_user_id: sesion.user.id, canal: CANAL })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) return cerrarSesion();
    if (!res.ok || data.error) {
      setStatus('Sin conexión');
      estadoVacio();
      return;
    }
    setStatus('En línea');
    if (data.conversation) conversationId = data.conversation.id;
    const msgs = data.messages || [];
    if (!msgs.length) { estadoVacio(); return; }
    wrap.innerHTML = '';
    let ultimoDia = '';
    for (const m of msgs) {
      const d = dia(m.created_at);
      if (d && d !== ultimoDia) {
        ultimoDia = d;
        const chip = document.createElement('div');
        chip.className = 'date-chip';
        chip.textContent = d;
        wrap.appendChild(chip);
      }
      const content = m.content || '';
      let imgUrl = null;
      try {
        const meta = typeof m.metadata === 'string' ? JSON.parse(m.metadata) : (m.metadata || {});
        if (meta.image_url && typeof meta.image_url === 'string') imgUrl = meta.image_url;
      } catch (_) {}
      if (m.role === 'user' || m.role === 'human') addMsg(content, 'user', m.created_at, imgUrl);
      else if (m.role === 'assistant' || m.role === 'bot' || m.role === 'system') addMsg(content, 'ai', m.created_at, imgUrl);
    }
    main.scrollTop = main.scrollHeight;
  } catch (e) {
    estadoVacio();
  }
}

async function enviar() {
  const text = input.value.trim();
  const hasImage = !!pendingImage;
  if ((!text && !hasImage) || enviando) return;

  input.value = '';
  autoGrow();
  const imageDataUrl = hasImage ? pendingImage.dataUrl : null;
  pendingImage = null;
  imagePreview.classList.remove('visible');
  fileInput.value = '';

  addMsg(text || '📷 Imagen', 'user', new Date().toISOString(), imageDataUrl);
  addTyping();
  enviando = true;
  setSendState();

  try {
    const payload = {
      prompt: text || 'Describe esta imagen',
      agente_id: AGENTE_ID,
      canal: CANAL,
      external_user_id: sesion.user.id
    };
    if (conversationId) payload.conversation_id = conversationId;
    if (imageDataUrl) payload.image_url = imageDataUrl;

    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    removeTyping();

    if (res.status === 401) return cerrarSesion('Tu sesión expiró. Inicia sesión de nuevo.');
    if (res.status === 403) { addMsg('No tienes acceso a esta conversación.', 'ai'); return; }

    if (data.conversation_id) conversationId = data.conversation_id;

    if (data.skipped === true || data.modo_humano === true) {
      addMsg(data.respuesta || 'Tu mensaje fue recibido. Un asesor humano continuará la conversación.', 'ai', new Date().toISOString());
    } else if (res.ok && data.respuesta) {
      addMsg(data.respuesta, 'ai', new Date().toISOString());
    } else if (data.error || !res.ok) {
      addMsg(data.respuesta || data.error || ('Error del servidor (' + res.status + ')'), 'ai');
    }
  } catch (e) {
    removeTyping();
    addMsg('Error de conexión. Intenta de nuevo.', 'ai');
  } finally {
    enviando = false;
    setSendState();
  }
}

function nuevaConversacion() {
  conversationId = null;
  estadoVacio();
}

async function cerrarSesion(msg) {
  if (msg) showToast(msg);
  await _supabase.auth.signOut();
  window.location.href = LOGIN_URL;
}

function setSendState() {
  document.getElementById('send-btn').disabled = enviando;
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
}

document.getElementById('attach-btn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    fileInput.value = '';
    showToast('Solo se permiten imágenes.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    fileInput.value = '';
    showToast('La imagen supera 10 MB.');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = { dataUrl: reader.result, name: file.name };
    imageThumb.src = reader.result;
    imageName.textContent = file.name;
    imagePreview.classList.add('visible');
  };
  reader.readAsDataURL(file);
});

imageRemove.addEventListener('click', () => {
  pendingImage = null;
  fileInput.value = '';
  imagePreview.classList.remove('visible');
});

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviar();
  }
});
document.getElementById('send-btn').addEventListener('click', enviar);
document.getElementById('nuevo-btn').addEventListener('click', nuevaConversacion);
document.getElementById('salir-btn').addEventListener('click', () => cerrarSesion());

(async function init() {
  if (!AGENTE_ID) {
    wrap.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'msg error';
    w.innerHTML = '<div class="bubble">Falta el agente a probar. <a href="dashboard.html">Volver al dashboard</a></div>';
    wrap.appendChild(w);
    return;
  }
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = LOGIN_URL; return; }
  const { data: { user }, error } = await _supabase.auth.getUser(session.access_token);
  if (error || !user) { window.location.href = LOGIN_URL; return; }
  sesion = session;
  document.getElementById('user-email').textContent = user.email;
  cargarHistorial();
})();
</script>
</body>
</html>
