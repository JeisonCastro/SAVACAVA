<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Editor de Sitio | AUVRO</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
  background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;z-index:10;
}
.back-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:var(--bg);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;text-decoration:none;transition:all .2s;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent)}
.site-avatar{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;
  background:rgba(14,165,233,.12);border:1px solid rgba(14,165,233,.24);color:var(--accent);
  font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;text-transform:uppercase;
}
.title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
#site-name{font-weight:800;font-size:.95rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-sub{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px}
.tokens-badge{
  display:flex;align-items:center;gap:.3rem;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:4px 8px;font-size:.72rem;flex-shrink:0;
}
.tokens-badge i{color:var(--yellow);font-size:.65rem}
.view-link{
  font-size:.72rem;color:var(--accent);text-decoration:none;white-space:nowrap;
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.view-link:hover{text-decoration:underline}
.theme-toggle-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border2);background:var(--bg);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.theme-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle-btn .icon-sun{display:none}
.theme-toggle-btn .icon-moon{display:block}
body.light-mode .theme-toggle-btn .icon-sun{display:block}
body.light-mode .theme-toggle-btn .icon-moon{display:none}

/* ── SECTIONS BAR ───────────────────────────────────────────────────────── */
.sections-bar{
  flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);
  overflow:hidden;transition:max-height .25s ease;
}
.sections-bar.collapsed{max-height:0!important;border-bottom:none}
.sections-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  cursor:pointer;user-select:none;
}
.sections-header:hover{color:var(--text)}
.sections-header i{transition:transform .2s;font-size:.6rem}
.sections-header.collapsed i.fa-chevron-up{transform:rotate(180deg)}
.sections-strip{
  display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:thin;
}
.sections-strip::-webkit-scrollbar{height:4px}
.sections-strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px}
.section-chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);
  font-size:.74rem;color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.section-chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(14,165,233,.05)}
.section-chip i{font-size:.6rem;color:var(--accent);flex-shrink:0}
.section-chip .chip-label{font-weight:600}
.section-chip .chip-tag{font-size:.62rem;color:var(--dim)}
.sections-loading{padding:8px 16px;font-size:.72rem;color:var(--dim);text-align:center}
.sections-empty{padding:8px 16px;font-size:.72rem;color:var(--dim);text-align:center}

/* ── MESSAGES ───────────────────────────────────────────────────────────── */
main{
  flex:1 1 auto;overflow-y:auto;padding:18px 14px 10px;scroll-behavior:smooth;
  overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
  background:var(--chat-panel);
}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:14px}
.msg{display:flex;flex-direction:column;max-width:min(72%,680px);animation:msgFadeIn .22s ease}
@keyframes msgFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.msg.system{align-self:center;align-items:center;max-width:90%}
.bubble{
  padding:10px 12px;border-radius:14px;line-height:1.55;font-size:.9rem;word-break:break-word;
  box-shadow:0 1px 3px rgba(16,24,40,.08);position:relative;
}
.msg-role{
  display:block;font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:.25rem;
}
.msg-text{display:block}
.msg.user .bubble{background:var(--bubble-user);border:1px solid var(--border);border-bottom-right-radius:5px}
.msg.ai .bubble{background:var(--bubble-ai);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.system .bubble{
  background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.15);
  border-radius:12px;font-size:.82rem;color:var(--muted);text-align:center;
}
.bubble ul{margin:4px 0 4px 18px}
.bubble a{color:var(--accent2);text-decoration:underline}
.bubble code{background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:.82rem}
.typing{display:flex;gap:5px;padding:8px 4px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite;opacity:.3}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center;gap:6px;padding:2rem;color:var(--dim)}
.empty-state .empty-icon{
  width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--accent);
}
.empty-state .empty-title{font-weight:700;font-size:1rem;color:var(--text)}
.empty-state .empty-sub{font-size:.85rem;max-width:340px;line-height:1.5}

/* ── PROPOSAL CARD ──────────────────────────────────────────────────────── */
.proposal-card{
  margin-top:8px;border:1px solid var(--border2);border-radius:12px;
  overflow:hidden;background:var(--bg);
}
.proposal-header{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface);border-bottom:1px solid var(--border2);font-size:.78rem;font-weight:600;
}
.proposal-header i{font-size:.7rem}
.proposal-header .riesgo-bajo{color:var(--green)}
.proposal-header .riesgo-medio{color:var(--yellow)}
.proposal-header .riesgo-alto{color:var(--red)}
.proposal-body{padding:10px 12px;font-size:.82rem;line-height:1.5;color:var(--text)}
.proposal-changes{
  margin-top:6px;padding:8px 10px;background:var(--bg2);border-radius:8px;
  font-size:.78rem;color:var(--muted);max-height:120px;overflow-y:auto;
}
.proposal-changes .change-item{
  padding:4px 0;border-bottom:1px solid var(--border2);display:flex;gap:6px;
}
.proposal-changes .change-item:last-child{border-bottom:none}
.proposal-changes .change-arrow{color:var(--accent);flex-shrink:0;font-size:.7rem;margin-top:2px}
.proposal-actions{
  display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border2);background:var(--surface);
}
.proposal-btn{
  flex:1;padding:8px 12px;border-radius:8px;border:none;font-size:.82rem;font-weight:600;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.proposal-btn:disabled{opacity:.5;cursor:not-allowed}
.proposal-btn-approve{background:var(--accent);color:#fff}
.proposal-btn-approve:hover:not(:disabled){background:var(--accent2)}
.proposal-btn-reject{background:var(--bg2);color:var(--text);border:1px solid var(--border2)}
.proposal-btn-reject:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.proposal-btn-adjust{background:var(--bg2);color:var(--text);border:1px solid var(--border2)}
.proposal-btn-adjust:hover:not(:disabled){border-color:var(--yellow);color:var(--yellow)}

/* ── UNDO BANNER ────────────────────────────────────────────────────────── */
.undo-banner{
  display:none;align-items:center;justify-content:center;gap:10px;
  padding:8px 16px;background:rgba(14,165,233,.08);border-top:1px solid rgba(14,165,233,.2);
  font-size:.82rem;color:var(--accent);flex:0 0 auto;
}
.undo-banner.visible{display:flex}
.undo-banner button{
  background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;
  font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;
}
.undo-banner button:hover{background:var(--accent2)}
.undo-banner button:disabled{opacity:.5;cursor:not-allowed}
.undo-banner .undo-timer{font-size:.72rem;color:var(--muted)}

/* ── TOKEN WARNING ──────────────────────────────────────────────────────── */
.token-warning{
  display:none;padding:.4rem .8rem;background:rgba(251,191,36,.1);border-top:1px solid rgba(251,191,36,.2);
  font-size:.72rem;color:var(--yellow);text-align:center;flex:0 0 auto;
}
.token-warning.visible{display:block}
.token-warning button{
  background:var(--yellow);color:#000;border:none;border-radius:6px;padding:3px 8px;
  font-size:.7rem;font-weight:600;margin-left:.4rem;cursor:pointer;
}

/* ── COMPOSER ───────────────────────────────────────────────────────────── */
footer{
  flex:0 0 auto;padding:10px 16px;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  background:var(--surface);border-top:1px solid var(--border);
}
.composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#editor-input{
  flex:1;min-height:44px;max-height:118px;padding:12px 14px;background:var(--bg);
  border:1px solid var(--border2);border-radius:14px;color:var(--text);
  font-family:'Inter',system-ui,sans-serif;font-size:.9rem;resize:none;outline:none;line-height:1.5;
}
#editor-input:focus{border-color:var(--accent)}
#editor-input::placeholder{color:var(--dim)}
#send-btn{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
  box-shadow:0 4px 14px rgba(14,165,233,.3);
}
#send-btn:hover{background:var(--accent2);transform:translateY(-1px)}
#send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ── TOAST ──────────────────────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:.84rem;box-shadow:0 12px 40px rgba(0,0,0,.35);
  display:none;z-index:50;max-width:90vw;text-align:center;
}

/* ── DARK MODE ──────────────────────────────────────────────────────────── */
body:not(.light-mode) .bubble{box-shadow:0 1px 3px rgba(0,0,0,.4)}
body:not(.light-mode) #editor-input{background:var(--bg2)}
body:not(.light-mode) .back-btn,body:not(.light-mode) .theme-toggle-btn{background:var(--bg2)}
body:not(.light-mode) .proposal-card{background:var(--bg2)}
body:not(.light-mode) .proposal-header{background:var(--bg)}
body:not(.light-mode) .proposal-changes{background:var(--bg)}

/* ── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media(max-width:768px){
  .view-link span{display:none}
  .sections-strip{padding:0 12px 6px}
}
@media(max-width:560px){
  .msg{max-width:88%}
  #editor-input{font-size:16px!important}
  .proposal-actions{flex-direction:column}
}
</style>

const params = new URLSearchParams(window.location.search);
const PROYECTO_ID = params.get('id');
const PROYECTO_NOMBRE = params.get('nombre') || 'Editor de Sitio';
const PROYECTO_SLUG = params.get('slug') || '';
const LOGIN_URL = '/login.html?redirect=' + encodeURIComponent('/editor.html' + window.location.search);

};

/* ── UTILS ──────────────────────────────────────────────────────────────── */

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function fmt(s) {
  let out = esc(s);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|\s)\*([^*]+)\*/g, '$1<em>$2</em>');
  const lines = out.split('\n');
  const html = [];
  let ul = false;
  for (const line of lines) {
    const bullet = line.match(/^[-•]\s+(.*)$/);
    if (bullet) {
      if (!ul) { html.push('<ul>'); ul = true; }
      html.push('<li>' + bullet[1] + '</li>');
    } else {
      if (ul) { html.push('</ul>'); ul = false; }
      html.push(line);
    }
  }
  if (ul) html.push('</ul>');
  return html.join('<br>');
}

function fmtTokens(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'K';
  return String(n);
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.style.display = 'none'; }, 3500);
}

function toggleTheme() {
  const claro = document.body.classList.toggle('light-mode');
  try { localStorage.setItem('auvrouter_theme', claro ? 'light' : 'dark'); } catch (_) {}
}

/* ── CHAT BUBBLES ───────────────────────────────────────────────────────── */

function addMsg(text, tipo, extra) {
  const div = document.createElement('div');
  div.className = 'msg ' + (tipo === 'user' ? 'user' : tipo === 'system' ? 'system' : 'ai');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (tipo !== 'system') {
    const label = document.createElement('span');
    label.className = 'msg-role';
    label.textContent = tipo === 'user' ? 'Tú' : 'Editor IA';
    bubble.appendChild(label);
  }
  const body = document.createElement('span');
  body.className = 'msg-text';
  body.innerHTML = fmt(text);
  bubble.appendChild(body);
  if (extra) bubble.appendChild(extra);
  div.appendChild(bubble);
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
  return div;
}

function addProposalCard(respuesta, riesgo, cambios, resumen) {
  const card = document.createElement('div');
  card.className = 'proposal-card';
  card.innerHTML = `
    <div class="proposal-header">
      <i class="fas fa-clipboard-check"></i>
      <span>Propuesta de cambios</span>
      <span class="riesgo-${riesgo}" style="margin-left:auto;font-size:.7rem;text-transform:uppercase">${riesgo}</span>
    </div>
    <div class="proposal-body">${fmt(respuesta)}</div>
    ${cambios.length > 0 ? `<div class="proposal-changes">
      ${cambios.map(c => `<div class="change-item">
        <span class="change-arrow"><i class="fas fa-arrow-right"></i></span>
        <span>${esc(c.search.substring(0, 80))}${c.search.length > 80 ? '...' : ''} → ${esc(c.replace.substring(0, 60))}${c.replace.length > 60 ? '...' : ''}</span>
      </div>`).join('')}
    </div>` : ''}
    <div class="proposal-actions" id="proposal-actions">
      <button class="proposal-btn proposal-btn-approve" onclick="aprobarPropuesta()">
        <i class="fas fa-check"></i> Aprobar cambios
      </button>
      <button class="proposal-btn proposal-btn-reject" onclick="rechazarPropuesta()">
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button class="proposal-btn proposal-btn-adjust" onclick="ajustarPropuesta()">
        <i class="fas fa-pen"></i> Ajustar
      </button>
    </div>
  `;
  wrap.appendChild(card);
  main.scrollTop = main.scrollHeight;
  return card;
}

function addTyping() {
  removeTyping();
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(bubble);
  wrap.appendChild(div);
  main.scrollTop = main.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

/* ── UNDO SYSTEM ────────────────────────────────────────────────────────── */

let undoTimer = null;
let undoSeconds = 0;

function showUndoBanner(sha) {
  const banner = document.getElementById('undo-banner');
  const timer = document.getElementById('undo-timer');
  banner.classList.add('visible');
  document.getElementById('undo-btn').disabled = false;
  undoSeconds = 300;
  timer.textContent = `(${undoSeconds}s)`;
  clearInterval(undoTimer);
  undoTimer = setInterval(() => {
    undoSeconds--;
    timer.textContent = `(${undoSeconds}s)`;
    if (undoSeconds <= 0) {
      clearInterval(undoTimer);
      banner.classList.remove('visible');
      state.lastCommitSha = null;
    }
  }, 1000);
}

function hideUndoBanner() {
  clearInterval(undoTimer);
  document.getElementById('undo-banner').classList.remove('visible');
}

async function deshacer() {
  if (!state.lastCommitSha) return showToast('No hay cambios para deshacer');
  const btn = document.getElementById('undo-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Revirtiendo...';

  try {
    const res = await fetch('/.netlify/functions/site-editor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ action: 'undo', proyecto_id: PROYECTO_ID, previous_sha: state.lastCommitSha })
    });
    const data = await res.json();
    if (data.ok) {
      addMsg('Cambios revertidos. Tu sitio se está restaurando...', 'ai');
      showToast('Cambios deshechos');
      state.lastCommitSha = null;
      hideUndoBanner();
    } else {
      addMsg('No se pudo revertir: ' + (data.error || 'Error desconocido'), 'ai');
      btn.disabled = false;
    }
  } catch (err) {
    addMsg('Error al revertir: ' + err.message, 'ai');
    btn.disabled = false;
  }
}

/* ── SECTIONS ───────────────────────────────────────────────────────────── */

function toggleSections() {
  const bar = document.getElementById('sections-bar');
  const header = bar.querySelector('.sections-header');
  bar.classList.toggle('collapsed');
  header.classList.toggle('collapsed');
}

function renderSections(sections) {
  const strip = document.getElementById('sections-strip');
  if (!sections || !sections.length) {
    strip.innerHTML = '<div class="sections-empty">Sin secciones detectadas</div>';
    return;
  }
  strip.innerHTML = sections.map((s, i) => {
    const icon = s.tag === 'header' ? 'fa-heading' : s.tag === 'footer' ? 'fa-shoe-prints' : s.tag === 'section' ? 'fa-layer-group' : 'fa-square';
    return '<div class="section-chip" onclick="selectSection(' + i + ')" title="' + esc(s.title) + '">' +
      '<i class="fas ' + icon + '"></i>' +
      '<span class="chip-label">' + esc(s.title) + '</span>' +
      '<span class="chip-tag">' + esc(s.tag) + '</span>' +
    '</div>';
  }).join('');
}

function selectSection(idx) {
  const s = state.sections[idx];
  if (!s) return;
  input.value = 'Quiero editar la sección "' + s.title + '". ';
  input.focus();
  autoGrow();
}

/* ── TOKEN WARNING ──────────────────────────────────────────────────────── */

function updateTokenWarning() {
  const warn = document.getElementById('token-warning');
  const warnText = document.getElementById('token-warning-text');
  if (state.tokens <= 0) {
    warn.classList.add('visible');
    warn.style.background = 'rgba(239,68,68,.1)';
    warn.style.borderColor = 'rgba(239,68,68,.2)';
    warn.style.color = 'var(--red)';
    warnText.textContent = 'Sin tokens disponibles.';
  } else if (state.tokens < 5000) {
    warn.classList.add('visible');
    warn.style.background = 'rgba(251,191,36,.1)';
    warn.style.borderColor = 'rgba(251,191,36,.2)';
    warn.style.color = 'var(--yellow)';
    warnText.textContent = 'Te quedan ' + fmtTokens(state.tokens) + ' tokens.';
  } else {
    warn.classList.remove('visible');
  }
}

/* ── PROPOSAL ACTIONS ───────────────────────────────────────────────────── */

async function aprobarPropuesta() {
  const proposal = state.pendingProposal;
  if (!proposal || !proposal.cambios.length) return;

  const actionsDiv = document.getElementById('proposal-actions');
  if (actionsDiv) {
    actionsDiv.innerHTML = '<button class="proposal-btn proposal-btn-approve" disabled><i class="fas fa-spinner fa-spin"></i> Aplicando...</button>';
  }

  try {
    const res = await fetch('/.netlify/functions/site-editor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({
        action: 'execute',
        proyecto_id: PROYECTO_ID,
        instruction: proposal.instruction,
        cambios: proposal.cambios,
        previous_sha: state.lastCommitSha
      })
    });
    const data = await res.json();

    if (data.ok) {
      state.tokens = data.tokens_remaining;
      document.getElementById('tokens-count').textContent = fmtTokens(data.tokens_remaining || 0);
      updateTokenWarning();
      state.lastCommitSha = data.previous_sha;
      state.pendingProposal = null;

      if (actionsDiv) {
        actionsDiv.innerHTML = '<button class="proposal-btn proposal-btn-approve" disabled style="background:var(--green)"><i class="fas fa-check"></i> Aplicado</button>';
      }

      addMsg(data.message || 'Cambios aplicados. Tu sitio se está actualizando...', 'ai');
      showToast('Edición aplicada — sitio actualizándose');
      showUndoBanner(data.commit_sha);
    } else {
      if (actionsDiv) {
        actionsDiv.innerHTML = `
          <button class="proposal-btn proposal-btn-approve" onclick="aprobarPropuesta()"><i class="fas fa-check"></i> Reintentar</button>
          <button class="proposal-btn proposal-btn-reject" onclick="rechazarPropuesta()"><i class="fas fa-times"></i> Cancelar</button>
        `;
      }
      addMsg('No pude aplicar los cambios: ' + (data.error || 'Error desconocido'), 'ai');
    }
  } catch (err) {
    if (actionsDiv) {
      actionsDiv.innerHTML = `
        <button class="proposal-btn proposal-btn-approve" onclick="aprobarPropuesta()"><i class="fas fa-check"></i> Reintentar</button>
        <button class="proposal-btn proposal-btn-reject" onclick="rechazarPropuesta()"><i class="fas fa-times"></i> Cancelar</button>
      `;
    }
    addMsg('Error de conexión: ' + err.message, 'ai');
  }
}

function rechazarPropuesta() {
  state.pendingProposal = null;
  const actionsDiv = document.getElementById('proposal-actions');
  if (actionsDiv) {
    actionsDiv.innerHTML = '<button class="proposal-btn proposal-btn-reject" disabled><i class="fas fa-times"></i> Cancelado</button>';
  }
  addMsg('Propuesta cancelada. Puedo preparar otra si lo necesitas.', 'ai');
}

function ajustarPropuesta() {
  state.pendingProposal = null;
  const actionsDiv = document.getElementById('proposal-actions');
  if (actionsDiv) {
    actionsDiv.innerHTML = '<button class="proposal-btn proposal-btn-adjust" disabled><i class="fas fa-pen"></i> Modificando...</button>';
  }
  addMsg('¿Qué te gustaría ajustar de la propuesta? Puedo modificar el texto, el alcance o cualquier detalle.', 'ai');
  input.focus();
}

/* ── SEND ───────────────────────────────────────────────────────────────── */

async function enviar() {
  const instruction = input.value.trim();
  if (!instruction || enviando) return;
  if (state.tokens <= 0) return showToast('Sin tokens. Recarga para continuar.', 'error');

  enviando = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMsg(instruction, 'user');
  addTyping();

  try {
    const res = await fetch('/.netlify/functions/site-editor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ action: 'analyze', proyecto_id: PROYECTO_ID, instruction })
    });
    const data = await res.json();
    removeTyping();

    if (data.ok) {
      state.tokens = data.tokens_remaining;
      document.getElementById('tokens-count').textContent = fmtTokens(data.tokens_remaining || 0);
      updateTokenWarning();

      // Si hay pregunta de clarificación
      if (data.pregunta_clarificacion) {
        addMsg(data.respuesta, 'ai');
        addMsg(data.pregunta_clarificacion, 'system');
        enviando = false;
        document.getElementById('send-btn').disabled = false;
        return;
      }

      // Guardar propuesta pendiente
      state.pendingProposal = {
        instruction,
        cambios: data.cambios || [],
        riesgo: data.riesgo || 'bajo'
      };

      // Renderizar respuesta + proposal card
      addMsg(data.respuesta, 'ai');

      if (data.cambios && data.cambios.length > 0) {
        addProposalCard(
          data.resumen_cambios || `${data.cambios.length} cambio(s) propuesto(s)`,
          data.riesgo || 'bajo',
          data.cambios,
          data.resumen_cambios
        );
      }
    } else {
      addMsg('No pude analizar la solicitud: ' + (data.error || 'Error desconocido'), 'ai');
    }
  } catch (err) {
    removeTyping();
    addMsg('Error de conexión: ' + err.message, 'ai');
  } finally {
    enviando = false;
    document.getElementById('send-btn').disabled = false;
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 118) + 'px';
}

/* ── TOKEN RECHARGE ─────────────────────────────────────────────────────── */

function abrirRecargaTokens() {
  const planes = [
    { tokens: 100000, precio: '$6.100 COP', label: 'Básico', totalCents: 610000 },
    { tokens: 500000, precio: '$21.600 COP', label: 'Estándar', totalCents: 2160000, featured: true },
    { tokens: 1000000, precio: '$37.000 COP', label: 'Premium', totalCents: 3700000 }
  ];
  addMsg('Planes de tokens disponibles:\n' + planes.map(p =>
    '- ' + p.label + ': ' + fmtTokens(p.tokens) + ' tokens — ' + p.precio
  ).join('\n') + '\n\nEscribe "Recargar básico", "Recargar estándar" o "Recargar premium" para continuar.', 'ai');
}

/* ── INIT ───────────────────────────────────────────────────────────────── */

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});
document.getElementById('send-btn').addEventListener('click', enviar);

(async function init() {
  if (!PROYECTO_ID) {
    wrap.innerHTML = '';
    addMsg('Falta el ID del proyecto. <a href="dashboard.html">Volver al dashboard</a>.', 'ai');
    return;
  }

  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = LOGIN_URL; return; }
  const { data: { user }, error } = await _supabase.auth.getUser(session.access_token);
  if (error || !user) { window.location.href = LOGIN_URL; return; }
  sesion = session;

  document.getElementById('site-name').textContent = PROYECTO_NOMBRE;
  document.getElementById('site-avatar').textContent = (PROYECTO_NOMBRE || 'S').trim().charAt(0).toUpperCase();
  document.getElementById('site-slug').textContent = PROYECTO_SLUG;

  try {
    const res = await fetch('/.netlify/functions/site-editor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ action: 'get_content', proyecto_id: PROYECTO_ID })
    });
    const data = await res.json();

    if (!data.ok) {
      addMsg('Error al cargar el proyecto: ' + (data.error || 'Desconocido'), 'ai');
      return;
    }

    state.tokens = data.tokens || 0;
    state.sections = data.sections || [];
    state.docsArchivos = data.docs_archivos || [];
    state.repoName = (data.github_owner || '') + '/' + (data.github_repo || '');
    state.lastCommitSha = data.last_commit_sha || null;

    document.getElementById('tokens-count').textContent = fmtTokens(data.tokens || 0);
    document.getElementById('site-link').href = data.site_url || '#';
    document.getElementById('site-slug').textContent = state.repoName;
    updateTokenWarning();
    renderSections(state.sections);

    addMsg('Hola! Soy tu asistente de edición web. Analizo tu sitio, te propongo cambios y solo aplico cuando tú lo apruebes. ¿Qué quieres modificar?', 'ai');

    if (state.docsArchivos.length) {
      addMsg('Contexto del proyecto cargado: ' + state.docsArchivos.join(', ') + '. Estoy listo.', 'ai');
    }
  } catch (err) {
    addMsg('Error de conexión al cargar el proyecto.', 'ai');
  }
})();
</script>
