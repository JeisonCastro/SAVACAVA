<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sin conexión | AUVRO</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--bg2:#ffffff;--surface:#ffffff;--border:#e2e8f0;--border2:#cbd5e1;
  --accent:#2563eb;--accent2:#1d4ed8;--red:#dc2626;--text:#0f172a;--muted:#64748b;--dim:#94a3b8;
}
body.light-mode{
  --bg:#f8fafc;--bg2:#ffffff;--surface:#ffffff;--border:#e2e8f0;--border2:#cbd5e1;
  --accent:#2563eb;--accent2:#1d4ed8;--red:#dc2626;--text:#0f172a;--muted:#64748b;--dim:#94a3b8;
}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:2rem;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.offline-container{max-width:380px;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.offline-icon{
  width:80px;height:80px;border-radius:20px;
  background:#fef2f2;border:1px solid #fecaca;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 1.5rem;color:var(--red);
}
.offline-title{font-family:'DM Sans',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.6rem}
.offline-msg{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:1.75rem;font-weight:300}
.offline-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:12px 28px;border-radius:10px;border:none;
  background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;
}
.offline-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.offline-btn:active{transform:translateY(0)}
.offline-hint{font-size:.75rem;color:var(--dim);margin-top:1.2rem}
</style>
</head>
<body class="light-mode">
  <div class="offline-container">
    <div class="offline-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
    </div>
    <h1 class="offline-title">Sin conexión a internet</h1>
    <p class="offline-msg">No se pudo conectar con el servidor. Verifica tu conexión a internet e inténtalo de nuevo.</p>
    <button class="offline-btn" onclick="location.reload()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Reintentar
    </button>
    <p class="offline-hint">AUVRO funciona offline para datos cacheados.</p>
  </div>
</body>
</html>
