    <style>
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
        .tienda-content { max-width: 1200px; }
        .prod-item { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .prod-item img { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; }
        .prod-item .info { flex: 1; min-width: 0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .stat .n { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
        .stat .l { font-size: .74rem; color: var(--muted); margin-top: 2px; }
        .sel-box { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--bg2); }
        .sel-box .attr-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .86rem; padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
        .sel-box .attr-head input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
        .sel-box .val-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 8px; }
        .sel-box .val-list label { display: flex; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 6px; border-radius: 6px; cursor: pointer; transition: background .15s; }
        .sel-box .val-list label:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
        .sel-box .val-list input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); }
        .toast { position: fixed; bottom: 18px; right: 18px; z-index: 9999; background: var(--surface); border: 1px solid var(--border2); border-left: 4px solid var(--green); padding: 12px 16px; border-radius: 10px; font-size: .86rem; box-shadow: var(--shadow-soft); opacity: 0; transform: translateY(8px); transition: .2s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-left-color: var(--red); }
        table input { width: auto; }
        .field select { width: 100%; padding: 9px 12px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: .88rem; }
        .btn-small.dep-active, .btn-main.dep-active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .card-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
    </style>

    <script>
(function () {
    const SUPABASE_URL = "https://zsxkfqnalkfvwjrzuqip.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzeGtmcW5hbGtmdndqcnp1cWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDgyODMsImV4cCI6MjA5MjAyNDI4M30.R4j23l3IHEL966VupeR-Sx_KtDQzB8NzfJtEVDGewGs";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let session = null;
    let isAdmin = false;
    const ctx = { proyecto_id: '', slug: '', modulos: [] };
    const S = { productos: [], categorias: [], atributos: [], ordenes: [], clientes: [], editandoId: null, imagenes: [], archivoDigital: null, _varsIds: [] };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const fmtCOP = (c) => '$' + (Math.round(Number(c) || 0) / 100).toLocaleString('es-CO');

    let toastTimer = null;
    function toast(msg, err) {
        const t = $('toast');
        t.textContent = msg; t.className = 'toast show' + (err ? ' error' : '');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2600);
    }

    async function api(action, body = {}) {
        const res = await fetch('/.netlify/functions/tienda', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session ? session.access_token : '') },
            body: JSON.stringify({ action, ...body })
        });
        return res.json();
    }

    function tipoLabel(t) {
        return { simple: 'Simple', fisico: 'Simple', variable: 'Variable', digital: 'Digital', servicio: 'Servicio', catalogo: 'Catálogo', tour: 'Tour' }[t] || t || '—';
    }

    function toggleTheme() {
        const claro = document.body.classList.toggle('light-mode');
        try { localStorage.setItem('auvrouter_theme', claro ? 'light' : 'dark'); } catch (_) {}
        actualizarBotonTema();
    }
    function actualizarBotonTema() {
        const btn = $('theme-toggle');
        if (!btn) return;
        const claro = document.body.classList.contains('light-mode');
        btn.innerHTML = claro ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    try { if (localStorage.getItem('auvrouter_theme') === 'light') document.body.classList.add('light-mode'); } catch (_) {}

    async function init() {
        const { data } = await _supabase.auth.getSession();
        session = data.session;
        if (!session) { window.location.href = 'login.html'; return; }
        $('tb-email').textContent = session.user.email;

        // Detectar si es admin
        try {
            const { data: perfil } = await _supabase.from('perfiles').select('is_admin').eq('id', session.user.id).maybeSingle();
            isAdmin = perfil?.is_admin === true;
        } catch (_) {}

        const params = new URLSearchParams(window.location.search);
        const proyecto = params.get('proyecto');
        const slug = params.get('slug');
        ctx.proyecto_id = proyecto || '';
        ctx.slug = slug || '';

        const tiendaGmail = params.get('tienda_gmail');
        if (tiendaGmail) {
            try {
                const res = await fetch('/.netlify/functions/conectar-gmail-tienda', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                    body: JSON.stringify({ action: 'guardar', proyecto_id: tiendaGmail })
                });
                const d = await res.json();
                toast(d.ok ? 'Gmail de la tienda conectado' : ('Error: ' + (d.error || 'reintenta')), !d.ok);
            } catch (_) { toast('Error conectando Gmail', true); }
            history.replaceState({}, '', window.location.pathname + (proyecto ? '?proyecto=' + proyecto : ''));
        }

        if (!ctx.proyecto_id) {
            $('main').innerHTML = '<div class="card"><div class="empty">Falta el parámetro proyecto. Vuelve al panel y usa "Gestionar tienda".</div></div>';
            return;
        }
        try {
            const info = await api('info', { proyecto_id: ctx.proyecto_id });
            if (!info.ok) throw new Error(info.error || 'Sin acceso a la tienda');
            const t = info.tienda;
            ctx.modulos = Array.isArray(info.modulos) ? info.modulos : [];
            ctx.slug = t.slug || ctx.slug;
            $('tb-nombre').textContent = (t.nombre || 'Mi tienda') + ' · Tienda';
            // Mostrar la sección Deportes solo si el proyecto tiene el módulo activo
            const navDep = document.querySelector('.sidebar nav a[data-sec="deportes"]');
            const tieneDeportes = ctx.modulos.includes('deportes');
            if (navDep) navDep.style.display = tieneDeportes ? '' : 'none';
            if (!tieneDeportes) depTab = 'deportistas';
            const u = $('tb-ver');
            if (t.netlify_url) { u.href = t.netlify_url; u.style.display = ''; }
            else if (t.slug) { u.href = 'https://' + t.slug + '.netlify.app'; u.style.display = ''; }
            const back = $('back-panel-auvro');
            if (back) {
                try {
                    const ultima = (localStorage.getItem('auvro_last_vista') || '').toLowerCase();
                    if (ultima) back.href = 'dashboard.html#' + ultima;
                } catch (_) {}
            }
            nav('dashboard');
        } catch (err) {
            $('main').innerHTML = '<div class="card"><div class="empty">' + esc(err.message || 'Error') + '</div></div>';
        }
    }

    function nav(sec) {
        document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.toggle('active', a.getAttribute('data-sec') === sec));
        // Sync mobile bottom nav
        document.querySelectorAll('.mobile-bottom-item').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('bottom-' + sec);
        if (activeBtn) activeBtn.classList.add('active');
        // Close mobile menu
        toggleMobileMenu(false);
        ({ dashboard: renderDashboard, productos: renderProductos, categorias: renderCategorias,
            atributos: renderAtributos, ordenes: renderOrdenes, clientes: renderClientes,
            pasarela: renderPasarela, notificaciones: renderNotificaciones, agentes: renderAgentesTienda,
            pipeline: renderPipeline, deportes: renderDeportes, turismo: renderTurismo })[sec]();
        return false;
    }

    // ── RESUMEN ──
    async function renderDashboard() {
        const main = $('main');
        main.innerHTML = '<div class="empty">Cargando…</div>';
        try {
            const [p, o, c] = await Promise.all([
                api('listar_productos', { proyecto_id: ctx.proyecto_id }),
                api('listar_ordenes', { proyecto_id: ctx.proyecto_id }),
                api('listar_clientes', { proyecto_id: ctx.proyecto_id })
            ]);
            const prods = (p.ok && p.productos) || [];
            const ords = (o.ok && o.ordenes) || [];
            const clis = (c.ok && c.clientes) || [];
            const pend = ords.filter(x => x.estado !== 'pagada').length;
            const vendido = ords.filter(x => x.estado === 'pagada').reduce((a, x) => a + Number(x.total_cents || 0), 0);
            S.productos = prods; S.ordenes = ords; S.clientes = clis;
            main.innerHTML = `
                <div class="stats">
                    <div class="stat"><div class="n">${prods.length}</div><div class="l">Productos</div></div>
                    <div class="stat"><div class="n">${pend}</div><div class="l">Órdenes pendientes</div></div>
                    <div class="stat"><div class="n">${clis.length}</div><div class="l">Clientes</div></div>
                    <div class="stat"><div class="n">${fmtCOP(vendido)}</div><div class="l">Vendido</div></div>
                </div>
                <div class="card">
                    <h3 class="card-title">Accesos rápidos</h3>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <button class="btn-main" onclick="nuevoProducto()"><i class="fas fa-plus"></i> Nuevo producto</button>
                        <button class="btn-small" onclick="nav('categorias')">Categorías</button>
                        <button class="btn-small" onclick="nav('atributos')">Atributos</button>
                        <button class="btn-small" onclick="nav('ordenes')">Órdenes</button>
                    </div>
                </div>`;
        } catch (err) { main.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; }
    }

    // ── PRODUCTOS ──
    async function renderProductos() {
        const main = $('main');
        main.innerHTML = '<div class="empty">Cargando…</div>';
        try {
            const [p, c, a] = await Promise.all([
                api('listar_productos', { proyecto_id: ctx.proyecto_id }),
                api('listar_categorias', { proyecto_id: ctx.proyecto_id }),
                api('listar_atributos', { proyecto_id: ctx.proyecto_id })
            ]);
            if (!p.ok) throw new Error(p.error || 'Error');
            S.productos = p.productos || [];
            S.categorias = (c.ok && c.categorias) || [];
            S.atributos = (a.ok && a.atributos) || [];
            main.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
                    <h2 class="card-title" style="flex:1">Productos</h2>
                    <button class="btn-main" onclick="formProducto(null)"><i class="fas fa-plus"></i> Nuevo producto</button>
                </div>
                ${S.productos.length ? S.productos.map(p => `
                    <div class="prod-item">
                        ${p.imagen ? `<img src="${esc(p.imagen)}" alt="">` : '<div style="width:46px;height:46px;border-radius:8px;background:var(--bg);border:1px solid var(--border2)"></div>'}
                        <div class="info">
                            <div style="font-weight:700">${esc(p.nombre)}</div>
                            <div style="font-size:.74rem;color:var(--dim)">${tipoLabel(p.tipo)} · ${(p.tipo === 'variable' || p.tipo === 'catalogo') ? ((p.variaciones || []).length + ' variaciones') : fmtCOP(p.precio_cents)}${p.categoria ? ' · ' + esc(p.categoria) : ''}${p.tipo === 'simple' && p.stock != null ? ' · Stock: ' + p.stock : ''}${p.activo ? '' : ' · <span style="color:var(--red)">oculto</span>'}</div>
                        </div>
                        <button class="btn-small" onclick="editarProducto('${p.id}')"><i class="fas fa-pen"></i> Editar</button>
                        <button class="btn-small danger" onclick="eliminarProducto('${p.id}','${esc(p.nombre)}')"><i class="fas fa-trash"></i></button>
                    </div>`).join('')
                : '<div class="card"><div class="empty">No hay productos todavía. Crea el primero.</div></div>'}
            `;
        } catch (err) { main.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; }
    }

    function editarProducto(id) {
        const p = S.productos.find(x => x.id === id);
        formProducto(p || null);
    }

    async function nuevoProducto() {
        const [c, a] = await Promise.all([
            api('listar_categorias', { proyecto_id: ctx.proyecto_id }),
            api('listar_atributos', { proyecto_id: ctx.proyecto_id })
        ]);
        S.categorias = (c.ok && c.categorias) || [];
        S.atributos = (a.ok && a.atributos) || [];
        document.querySelectorAll('.sidebar nav a').forEach(x => x.classList.toggle('active', x.getAttribute('data-sec') === 'productos'));
        formProducto(null);
    }

    function formProducto(prod) {
        S.editandoId = prod ? prod.id : null;
        S.imagenes = (Array.isArray(prod && prod.imagenes) && prod.imagenes.length ? prod.imagenes : (prod && prod.imagen ? [prod.imagen] : [])).map(u => String(u || ''));
        S.archivoDigital = null;
        const tipo = (prod && prod.tipo === 'fisico' ? 'simple' : (prod && prod.tipo)) || 'simple';
        const catId = (prod && prod.categoria_id) || '';

                    <div style="flex:1;min-width:90px" id="wrap-stock"><div class="field"><label>Stock</label><input id="p-stock" type="number" min="0" value="${tipo === 'simple' && prod && prod.stock != null ? prod.stock : ''}" placeholder="Vacío = ilimitado"></div></div>
                    <div style="flex:1;min-width:110px" id="wrap-sku"><div class="field"><label>SKU (opcional)</label><input id="p-sku" value="${esc(prod && prod.sku || '')}" placeholder="PEPITO-01"></div></div>

                <div class="field"><label>Descripción</label><input id="p-desc" value="${esc(prod && prod.descripcion || '')}" placeholder="Breve descripción para el cliente"></div>

                </div>
                <div class="field"><label>Ficha técnica (key: valor — solo informativo, no genera variantes)</label><textarea id="p-attrs" rows="2" placeholder="Material: Acero&#10;Garantía: 1 año">${esc(attrTxt)}</textarea></div>
                <div id="wrap-var" style="display:none">
                    <div class="field"><label>Variantes del producto</label>
                        <div id="p-selector"></div>
                        <div style="font-size:.72rem;color:var(--dim);margin-top:8px">
                            Marca el atributo y los valores que apliquen. Se generan todas las combinaciones automáticamente.<br>
                            Ej: Color (Rojo, Azul) + Talla (S, M, L) = 6 variaciones, cada una con su stock, precio e imagen.

                        <div style="margin-top:6px;color:var(--muted);line-height:1.5">Este producto se configura de forma visual (sin JSON) en el menú <strong>Experiencias → Turismo</strong>: pasajeros, tarifas, descuentos por grupo, extras, calendario de salidas, recogidas, traslados e itinerario.</div>

                </div>

                    <label style="font-size:.84rem;display:flex;align-items:center;gap:6px"><input type="checkbox" id="p-activo" ${!(prod && prod.activo === false) ? 'checked' : ''}> Disponible en la tienda</label>
                    <label id="wrap-wa" style="font-size:.84rem;display:flex;align-items:center;gap:6px;display:${tipo === 'catalogo' ? 'flex' : 'none'}"><input type="checkbox" id="p-whatsapp" ${prod && prod.whatsapp_button ? 'checked' : ''}> Botón WhatsApp</label>
                    <span style="flex:1"></span>

        syncTipo();

    function syncTipo() {
        const t = $('p-tipo').value;
        $('wrap-stock').style.display = t === 'simple' ? '' : 'none';
        $('wrap-digital').style.display = t === 'digital' ? '' : 'none';
        $('wrap-var').style.display = (t === 'variable' || t === 'catalogo') ? '' : 'none';
        $('wrap-tour').style.display = t === 'tour' ? '' : 'none';
        $('wrap-precio').style.display = t === 'catalogo' ? 'none' : '';
        $('wrap-sku').style.display = t === 'catalogo' ? 'none' : '';
        $('wrap-wa').style.display = t === 'catalogo' ? '' : 'none';
    }

    function renderSelector(selector) {
        const cont = $('p-selector');
        if (!cont) return;
        if (!S.atributos.length) { cont.innerHTML = '<div style="font-size:.8rem;color:var(--dim)">No hay atributos creados. Ve a la sección Atributos y crea uno (ej. Color, Talla).</div>'; return; }
        const mapa = {};
        (selector || []).forEach(a => { mapa[a.atributo_id] = a.valores || []; });
        cont.innerHTML = S.atributos.map(a => {
            const vals = (a.valores || []);
            const checked = mapa[a.id] ? true : false;
            return `<div class="sel-box">
                <div class="attr-head">
                    <input type="checkbox" class="sel-a" data-aid="${a.id}" ${checked ? 'checked' : ''}>
                    <span>${esc(a.nombre)}</span>
                    <span style="margin-left:auto;font-size:.72rem;font-weight:400;color:var(--dim)">${vals.length} valor${vals.length !== 1 ? 'es' : ''}</span>
                </div>
                <div class="val-list">
                    ${vals.map(v => `<label><input type="checkbox" class="sel-v" data-aid="${a.id}" data-val="${esc(String(v))}" ${(mapa[a.id] || []).includes(String(v)) ? 'checked' : ''}> ${esc(String(v))}</label>`).join('')}
                </div>
            </div>`;
        }).join('');
    }

    function renderImgs() {
        const cont = $('p-imgs');
        if (!cont) return;
        if (!S.imagenes.length) { cont.innerHTML = '<div style="font-size:.78rem;color:var(--dim)">Sin imágenes.</div>'; return; }
        cont.innerHTML = S.imagenes.map((u, i) => `
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
                <input value="${esc(u)}" id="p-img-${i}" placeholder="https://... o sube una imagen" style="flex:1;padding:7px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-size:.8rem">
                <input type="file" accept="image/*" style="display:none" id="p-imgf-${i}" onchange="imgSubir(${i}, this)">
                <button class="btn-small" onclick="document.getElementById('p-imgf-${i}').click()"><i class="fas fa-upload"></i></button>
                <button class="btn-small danger" onclick="quitImg(${i})"><i class="fas fa-trash"></i></button>
            </div>`).join('');
    }
    function addImg() { S.imagenes.push(''); renderImgs(); }
    function quitImg(i) { S.imagenes.splice(i, 1); renderImgs(); }
    function imgSubir(i, input) {
        const f = input.files && input.files[0]; if (!f) return;
        if (f.size > 7 * 1024 * 1024) { toast('La imagen supera 7 MB', true); input.value = ''; return; }
        const rd = new FileReader();
        rd.onload = () => { S.imagenes[i] = String(rd.result); const el = $('p-img-' + i); if (el) el.value = String(rd.result); };
        rd.readAsDataURL(f);
    }
    function leerArchivo(input) {
        const f = input.files && input.files[0]; if (!f) return;
        if (f.size > 7 * 1024 * 1024) { toast('El archivo supera 7 MB', true); input.value = ''; return; }
        const rd = new FileReader();
        rd.onload = () => { S.archivoDigital = { dataUrl: String(rd.result), name: f.name }; $('p-file-note').textContent = 'Archivo digital: ' + f.name; };
        rd.readAsDataURL(f);
    }

    async function guardarProducto() {
        const msg = $('p-msg');
        const nombre = $('p-nombre').value.trim();
        const tipo = $('p-tipo').value;
        const precio = Math.round(Number($('p-precio').value) || 0) * 100;
        if (!nombre) { msg.textContent = 'Escribe el nombre del producto'; msg.className = 'msg error'; return; }
        if (tipo !== 'variable' && tipo !== 'catalogo' && tipo !== 'tour' && precio <= 0) { msg.textContent = 'El precio debe ser mayor a 0'; msg.className = 'msg error'; return; }
        let stock = null;
        if (tipo === 'simple') { const v = $('p-stock').value.trim(); stock = v === '' ? null : Math.max(0, Math.floor(Number(v) || 0)); }
        const desc = $('p-desc').value.trim();
        const categoria_id = $('p-cat').value || null;
        const sku = $('p-sku').value.trim() || null;
        const atributos = {};
        ($('p-attrs').value || '').split('\n').map(s => s.trim()).filter(Boolean).forEach(l => { const i = l.indexOf(':'); if (i > -1) atributos[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
        if (tipo === 'tour') {
            // El producto tour se configura sin JSON en Experiencias (Turismo).
            // Solo se preserva JSON avanzado si alguien lo pega en el campo oculto.
            const cfgEl = $('p-tourcfg');
            const cfgRaw = cfgEl ? (cfgEl.value || '').trim() : '';
            if (cfgRaw) {
                try {
                    const cfg = JSON.parse(cfgRaw);
                    if (cfg && typeof cfg === 'object') Object.assign(atributos, cfg);
                } catch (_) {
                    /* JSON avanzado inválido: se ignora; la configuración se hace en Experiencias. */
                }
            }
        }
        let selector = [];
        if (tipo === 'variable' || tipo === 'catalogo') {
            document.querySelectorAll('.sel-a:checked').forEach(chk => {
                const aid = chk.getAttribute('data-aid');
                const attr = S.atributos.find(a => String(a.id) === aid); if (!attr) return;
                const valores = [];
                document.querySelectorAll('.sel-v[data-aid="' + aid + '"]:checked').forEach(v => valores.push(v.getAttribute('data-val')));
                if (valores.length) selector.push({ atributo_id: aid, nombre: attr.nombre, valores });
            });
        }
        const imagenes = S.imagenes.map((_, i) => { const el = $('p-img-' + i); return el ? el.value.trim() : ''; }).filter(Boolean);
        const imagen = imagenes[0] || '';
        const activo = $('p-activo').checked;
        const whatsapp_button = $('p-whatsapp') ? $('p-whatsapp').checked : false;
        msg.textContent = 'Guardando…'; msg.className = 'msg';
        try {
            const data = await api('guardar_producto', {
                proyecto_id: ctx.proyecto_id, id: S.editandoId || null,
                nombre, descripcion: desc, precio_cents: precio, tipo, activo, whatsapp_button, stock, imagen, imagenes,
                categoria_id, categoria: null, sku,
                atributos: Object.keys(atributos).length ? atributos : null,
                atributos_selector: selector.length ? selector : null,
                archivo_data_url: S.archivoDigital ? S.archivoDigital.dataUrl : null,
                filename: S.archivoDigital ? S.archivoDigital.name : 'archivo'
            });
            if (!data.ok) throw new Error(data.error || 'No se pudo guardar');
            toast('Producto guardado');
            if (data.producto && (data.producto.tipo === 'variable' || data.producto.tipo === 'catalogo') && Array.isArray(data.producto.variaciones)) {
                formVariaciones(data.producto);
            } else if (data.producto && data.producto.tipo === 'tour') {
                toast('Producto guardado. Ahora configura la experiencia (sin JSON).');
                turForm(data.producto.id);
            } else { renderProductos(); }
        } catch (err) { msg.textContent = 'Error: ' + err.message; msg.className = 'msg error'; }
    }

    function formVariaciones(producto) {
        const vars = (producto.variaciones || []).slice();
        S._varsIds = vars.map(v => v.id);
        $('main').innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
                <button class="btn-small" onclick="renderProductos()"><i class="fas fa-arrow-left"></i> Volver a productos</button>
                <h2 class="card-title" style="flex:1">Variaciones de ${esc(producto.nombre)}</h2>
            </div>
            ${vars.length ? `<div class="card"><div class="table-wrap"><table>
                <thead><tr><th>Combinación</th><th>Precio</th><th>Promo</th><th>Stock</th><th>SKU</th><th>Imagen (URL)</th><th>Activo</th></tr></thead>
                <tbody>
                ${vars.map((v, i) => `
                    <tr>
                        <td style="font-weight:700;white-space:nowrap">${esc(v.nombre)}</td>
                        <td><input id="vx-p-${i}" type="number" min="0" value="${v.precio_cents != null ? Math.round(v.precio_cents / 100) : ''}" placeholder="Usa base" style="width:88px;padding:5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:.76rem"></td>
                        <td><input id="vx-pr-${i}" type="number" min="0" value="${v.precio_promo_cents != null ? Math.round(v.precio_promo_cents / 100) : ''}" placeholder="—" style="width:88px;padding:5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:.76rem"></td>
                        <td><input id="vx-s-${i}" type="number" min="0" value="${v.stock == null ? '' : v.stock}" placeholder="Ilimitado" style="width:74px;padding:5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:.76rem"></td>
                        <td><input id="vx-k-${i}" value="${esc(v.sku || '')}" placeholder="SKU" style="width:104px;padding:5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:.76rem"></td>
                        <td><input id="vx-i-${i}" value="${esc(v.imagen || '')}" placeholder="https://..." style="width:150px;padding:5px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:.76rem"></td>
                        <td style="text-align:center"><input type="checkbox" id="vx-a-${i}" ${v.activo === false ? '' : 'checked'}></td>
                    </tr>`).join('')}
                </tbody>
            </table></div>
            <div style="display:flex;gap:10px;margin-top:12px">
                <button class="btn-main btn-green" onclick="guardarVariaciones('${producto.id}')"><i class="fas fa-save"></i> Guardar variaciones</button>
                <button class="btn-small" onclick="renderProductos()">Cancelar</button>
            </div>
            <div class="msg" id="vx-msg"></div></div>`
            : '<div class="card"><div class="empty">Este producto no tiene combinaciones. Agrega atributos y valores en el formulario.</div></div>'}
        `;
    }

    async function guardarVariaciones(productoId) {
        const msg = $('vx-msg');
        const body = [];
        let i = 0;
        while (true) {
            const p = $('vx-p-' + i), s = $('vx-s-' + i), k = $('vx-k-' + i);
            if (!p) break;
            const pr = $('vx-pr-' + i), im = $('vx-i-' + i), a = $('vx-a-' + i);
            body.push({
                id: (S._varsIds && S._varsIds[i]) || null,
                precio_cents: p.value !== '' ? Math.round(Number(p.value) || 0) * 100 : null,
                precio_promo_cents: pr.value !== '' ? Math.round(Number(pr.value) || 0) * 100 : null,
                stock: s.value !== '' ? Math.max(0, Math.floor(Number(s.value) || 0)) : null,
                sku: k.value.trim(), imagen: im.value.trim(), activo: a.checked
            });
            i++;
        }
        const limpio = body.filter(b => b.id);
        if (!limpio.length) { toast('No hay variaciones para guardar', true); return; }
        msg.textContent = 'Guardando…'; msg.className = 'msg';
        try {
            const data = await api('guardar_variaciones', { producto_id: productoId, variaciones: limpio });
            if (!data.ok) throw new Error(data.error || 'No se pudo guardar');
            toast('Variaciones guardadas');
            renderProductos();
        } catch (err) { msg.textContent = 'Error: ' + err.message; msg.className = 'msg error'; }
    }

    async function eliminarProducto(id, nombre) {
        if (!confirm('Eliminar el producto "' + nombre + '"?')) return;
        const data = await api('eliminar_producto', { id });
        if (!data.ok) return toast('Error: ' + (data.error || 'No se pudo eliminar'), true);
        toast('Producto eliminado');
        renderProductos();
    }

    // ── PIPELINE DE VENTAS (estados tienda_pipeline) ──

        if (!data.ok) { main.innerHTML = '<div class="empty">' + esc(data.error) + '</div>'; return; }
        S.pipeline = data.estados || [];

        const rolDe = e => e.es_inicial ? 'inicial' : (e.es_cerrada ? 'cerrada' : (e.es_perdida ? 'perdida' : 'proceso'));
        const rolBadge = e => e.es_inicial
            ? '<span class="badge" style="background:rgba(14,165,233,.16);color:var(--accent)"><i class="fas fa-flag-checkered"></i> Inicial</span>'
            : (e.es_cerrada
            ? '<span class="badge badge-green"><i class="fas fa-check-circle"></i> Venta cerrada</span>'
            : (e.es_perdida
            ? '<span class="badge badge-red"><i class="fas fa-xmark-circle"></i> Perdida</span>'

        const rolNota = e => e.es_inicial
            ? '<div style="font-size:.7rem;color:var(--accent)">Los leads nuevos entran aquí.</div>'
            : (e.es_cerrada
            ? '<div style="font-size:.7rem;color:var(--green)">Se pagó → la venta se cierra y cuenta como ganada. El sistema la activa solo al aprobarse el pago.</div>'
            : (e.es_perdida
            ? '<div style="font-size:.7rem;color:var(--red)">No se pagó → la oportunidad se descarta.</div>'
            : '<div style="font-size:.7rem;color:var(--dim)">Etapa intermedia del lead mientras avanza.</div>'));
        const esTerminal = e => e.es_cerrada || e.es_perdida;

        main.innerHTML = `
            <h2 class="card-title" style="margin-bottom:14px">Pipeline de ventas (CRM)</h2>

            <div class="card" style="margin-bottom:14px">
                <p style="font-size:.82rem;color:var(--text);margin:0 0 10px"><b><i class="fas fa-circle-info" style="color:var(--accent)"></i> ¿Qué es un estado?</b></p>
                <p style="font-size:.78rem;color:var(--dim);margin:0 0 12px">El pipeline es la ruta por la que pasan cada uno de los leads de esta tienda. Define la forma en que el sistema <b>entiende las ventas de forma inteligente</b> según el pago:</p>
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">

        const color = $('pipe-color').value || '#0ea5e9';

        toast('Estado agregado'); renderPipeline();

        if (!data.ok) return toast('Error: ' + (data.error || 'No se pudo eliminar'), true);

    async function deportesApi(action, body = {}) {
        // Robusto: nunca lanza aunque el servidor responda HTML (413/errores de
        // gateway); siempre devuelve {ok:false, error} para mostrarlo al admin.
        try {
            const res = await fetch('/.netlify/functions/deportes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session ? session.access_token : '') },
                body: JSON.stringify({ action, ...body })
            });
            const txt = await res.text();
            let data = {};
            try { data = JSON.parse(txt); } catch (_) { data = {}; }
            if (!res.ok && !data.error) {
                data = { ok: false, error: 'HTTP ' + res.status + ': ' + String(txt).slice(0, 300) };
            }
            return data;
        } catch (err) {
            return { ok: false, error: 'Error de conexión: ' + (err.message || err) };
        }
    }

    // Subida de medios EXACTAMENTE igual que Productos (imgSubir + guardarProducto):
    // al elegir el archivo se convierte a data-URL local (preview) y se sube a
    // Storage al GUARDAR, dentro del backend (mismo bucket público `productos`).
    function depSubir(input, cb) {
        const file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { toast('La imagen/video supera 8 MB', true); input.value = ''; return; }
        const rd = new FileReader();
        rd.onload = () => {
            const u = String(rd.result);
            cb && cb(u);
        };
        rd.readAsDataURL(file);
    }

    function depSubirVarias(input, start) {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        const reader = new FileReader();
        reader.readAsDataURL(files[start]);
        reader.onload = () => {
            window.__depGaleria = (window.__depGaleria || []).concat([String(reader.result)]);
            if (start + 1 < files.length) depSubirVarias(input, start + 1);
            else { input.value = ''; depFormDeportista($('dep-editing')?.value || null); }
        };
    }

    function depQuitarGaleria(i) {
        const g = window.__depGaleria || [];
        g.splice(i, 1);
        window.__depGaleria = g;
        depFormDeportista($('dep-editing')?.value || null);
    }

        const ficha = { texto: $('dp-ficha').value.trim(), galeria: window.__depGaleria || [], videos: $('dp-videos').value.split('\n').map(s => s.trim()).filter(Boolean) };
        const estadisticas = { texto: $('dp-estadisticas').value.trim() };
        try {
            const data = await deportesApi('guardar_deportista', {
                proyecto_id: ctx.proyecto_id, id: id || null,
                nombre: $('dp-nombre').value.trim(), fecha_nacimiento: $('dp-fecha').value || null,
                edad: $('dp-edad').value || null, categoria: $('dp-categoria').value.trim(),
                posicion: $('dp-posicion').value, pierna: $('dp-pierna').value,
                altura_cm: $('dp-altura').value || null, peso_kg: $('dp-peso').value || null,
                club: $('dp-club').value.trim(), pais: $('dp-pais').value.trim(), ciudad: $('dp-ciudad').value.trim(),
                nivel: $('dp-nivel').value, experiencia: $('dp-experiencia').value.trim(),
                fotografia_url: $('dp-foto').value.trim(),
                logros: $('dp-logros').value.split('\n').map(s => s.trim()).filter(Boolean),
                videos: ficha.videos,
                ficha, estadisticas, publico: $('dp-publico').checked, activo: $('dp-activo').checked

    // ── TURISMO (productos turísticos · wizard no técnico) ──
    let _turProducto = null;
    let _turPassthrough = { escalas: [], extras: [] };
    let _turStep = 1;

    async function turismoApi(action, body = {}) {
        try {
            const res = await fetch('/.netlify/functions/turismo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session ? session.access_token : '') },
                body: JSON.stringify({ action, ...body })
            });
            const txt = await res.text();
            let data = {};
            try { data = JSON.parse(txt); } catch (_) { data = {}; }
            if (!res.ok && !data.error) data = { ok: false, error: 'HTTP ' + res.status + ': ' + String(txt).slice(0, 300) };
            return data;
        } catch (err) {
            return { ok: false, error: 'Error de conexión: ' + (err.message || err) };
        }
    }

    function turPesoAcentos(input) { return Math.round((Number(String(input).replace(/[^0-9]/g, '')) || 0) * 100); }
    function turLineas(id) { return ($(id) ? String($(id).value || '') : '').split('\n').map(x => x.trim()).filter(Boolean); }

            ]);

            S.atributos = (a.ok && a.atributos) || [];
            formProducto(null);

    }

            main.innerHTML = `

    function turLeerEscalas() {
        const out = [];
        const c = $('tur-escalas');
        if (!c) return out;
        c.querySelectorAll('.tur-escala').forEach(row => {
            const q = (sel) => row.querySelector(sel) ? row.querySelector(sel).value.trim() : '';
            const desde = Number(q('.es-desde'));
            const hastaTxt = q('.es-hasta');
            const tipo = q('.es-tipo') || 'pct';
            const valorRaw = Number(q('.es-valor')) || 0;
            if (!desde || desde < 1) return;
            out.push({
                desde,
                hasta: hastaTxt !== '' ? Number(hastaTxt) : null,
                tipo,
                aplica_a: q('.es-aplica') || 'total',
                valor: tipo === 'fijo' ? Math.round(valorRaw * 100) : valorRaw,
                combina_con_promo: false,
                antes_de_extras: true
            });
        });
        return out;
    }

        const out = [];

        if (!c) return out;
        c.querySelectorAll('.tur-extra').forEach(row => {
            const q = (sel) => row.querySelector(sel) ? row.querySelector(sel).value.trim() : '';

            out.push({

        });

    }

    function turLeerCalendario() {
        const plantillas = [];
        const c = $('tur-plantillas');
        if (c) c.querySelectorAll('.tur-plantilla').forEach(row => {
            const q = (sel) => row.querySelector(sel) ? row.querySelector(sel).value.trim() : '';
            const hora = q('.pl-salida');
            if (!hora) return;
            plantillas.push({
                dias: q('.pl-dias').split(',').map(x => x.trim().toLowerCase()).filter(Boolean),
                hora_salida: hora,
                hora_regreso: q('.pl-regreso') || null,
                capacidad: Number(q('.pl-capacidad')) || 40,
                activo: true
            });
        });
        const fechasBloqueadas = [];
        const txt = $('tur-bloqueadas') ? String($('tur-bloqueadas').value || '') : '';
        txt.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
            const partes = l.split('|');
            const fecha = (partes[0] || '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(fecha)) fechasBloqueadas.push({ fecha, motivo: (partes[1] || '').trim() || null });
        });
        return { plantillas, fechas_bloqueadas: fechasBloqueadas };
    }

        const c = $('tur-recogidas');
        if (c) c.querySelectorAll('.tur-recogida').forEach(row => {
            const q = (sel) => row.querySelector(sel) ? row.querySelector(sel).value.trim() : '';
            const nombre = q('.rc-nombre');
            if (!nombre) return;
            recogidas.push({ nombre, zona: q('.rc-zona') || null, hora: q('.rc-hora') || null, costo_cents: Math.round((Number(q('.rc-costo')) || 0) * 100), activo: true });
        });
        const traslados = [];
        const t = $('tur-traslados');
        if (t) t.querySelectorAll('.tur-traslado').forEach(row => {
            const q = (sel) => row.querySelector(sel) ? row.querySelector(sel).value.trim() : '';
            const tipo = q('.tr-tipo');
            if (!tipo) return;
            traslados.push({
                tipo_vehiculo: tipo,
                capacidad: q('.tr-capacidad') !== '' ? Number(q('.tr-capacidad')) : null,
                origen: q('.tr-origen') || null,
                destino: q('.tr-destino') || null,
                precio_cents: Math.round((Number(q('.tr-precio')) || 0) * 100),
                incluido: !!(row.querySelector('.tr-incluido') && row.querySelector('.tr-incluido').checked)
            });
        });
        const itinerario = [];
        const itTxt = $('tur-itinerario') ? String($('tur-itinerario').value || '') : '';
        itTxt.split('\n').map(l => l.trim()).filter(Boolean).forEach((l, i) => {
            const partes = l.split('|');
            itinerario.push({ orden: i, hora: (partes[0] || '').trim() || null, titulo: (partes[1] || '').trim() || null, descripcion: (partes[2] || '').trim() || null });
        });
        return { recogidas, traslados, itinerario };
    }

    function turStep(n) {
        _turStep = Math.min(7, Math.max(1, Number(n) || 1));
        for (let i = 1; i <= 7; i++) {
            const sec = $('tur-sec-' + i);
            if (sec) sec.style.display = (i === _turStep) ? '' : 'none';
            const chip = $('tur-step-' + i);
            if (chip) chip.classList.toggle('dep-active', i === _turStep);
        }
        const prev = $('tur-prev'); if (prev) prev.style.visibility = _turStep === 1 ? 'hidden' : 'visible';
        const next = $('tur-next'); if (next) next.style.visibility = _turStep === 7 ? 'hidden' : 'visible';
        const save = $('tur-save'); if (save) save.style.display = _turStep === 7 ? '' : 'none';
    }
    function turPrev() { turStep(_turStep - 1); }
    function turNext() { turStep(_turStep + 1); }

    async function turGuardarConfig() {
        if (!_turProducto || !_turProducto.producto_id) return;
        const ed = {};
        const leer = (id) => $(id) ? String($(id).value || '').trim() : '';
        const leerArr = (id) => $(id) ? String($(id).value || '').split('\n').map(x => x.trim()).filter(Boolean) : [];

        const tarifas = [];
        const cont = $('tur-tarifas');
        if (cont) {
            cont.querySelectorAll('.tur-tarifa').forEach(row => {
                const q = (sel) => row.querySelector(sel) ? row.querySelector(sel).value.trim() : '';
                const nombre = q('.tt-nombre');
                if (!nombre) return;
                tarifas.push({
                    nombre,
                    edad_min: q('.tt-min') !== '' ? Number(q('.tt-min')) : null,
                    edad_max: q('.tt-max') !== '' ? Number(q('.tt-max')) : null,
                    precio_cents: Math.round((Number(q('.tt-precio')) || 0) * 100),
                    permitido: true
                });
            });
        }

        const body = {
            proyecto_id: ctx.proyecto_id,
            producto_id: _turProducto.producto_id,
            editorial: {
                tipo_experiencia: leer('tur-tipo'),
                destino: leer('tur-destino'),
                ubicacion: leer('tur-ubicacion'),
                duracion: leer('tur-duracion'),
                idiomas: leerArr('tur-idiomas'),
                incluye: leerArr('tur-incluye'),
                no_incluye: leerArr('tur-noincluye'),
                punto_encuentro: leer('tur-encuentro'),
                recomendaciones: leer('tur-recomendaciones'),
                restricciones: leer('tur-restricciones'),
                politica_cancelacion: leer('tur-politicas')
            },
            reglas: {
                pricing_modelo: leer('tur-pricing') || 'por_persona',
                requiere_adulto: !!( $('tur-adulto') && $('tur-adulto').checked ),
                min_pax: Number(leer('tur-minpax')) || 1,
                max_pax: leer('tur-maxpax') !== '' ? Number(leer('tur-maxpax')) : null,
                costo_proveedor_cents: Math.round((Number(leer('tur-costo')) || 0) * 100),
                impuesto_pct: Number(leer('tur-impuesto')) || 0
            },
            tarifas,
            escalas: turLeerEscalas(),
            extras: turLeerExtras(),
            calendario: turLeerCalendario(),
            logistica: turLeerLogistica()
        };

        const data = await turismoApi('guardar_config_tur', body);
        if (!data.ok) { toast('Error: ' + data.error, true); return; }
        toast('Configuración guardada');
        renderTurismo();
    }

    async function turReservas() {
        const main = $('main');
        main.innerHTML = '<div class="empty">Cargando reservas…</div>';
        try {
            const data = await turismoApi('listar_reservas', { proyecto_id: ctx.proyecto_id });
            if (!data.ok) throw new Error(data.error || 'Error');
            const lista = data.reservas || [];
            main.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
                    <button class="btn-small" onclick="renderTurismo()"><i class="fas fa-arrow-left"></i> Volver</button>
                    <h2 class="card-title" style="flex:1">Reservas de experiencias</h2>
                </div>
                ${lista.length ? `<div class="table-wrap"><table>
                    <thead><tr><th>Producto</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead>
                    <tbody>${lista.map(r => `
                        <tr>
                            <td style="font-weight:600">${esc(r.producto_nombre || '—')}</td>
                            <td>${esc((r.cliente && r.cliente.nombre) || '—')}<div style="font-size:.72rem;color:var(--dim)">${esc((r.cliente && (r.cliente.email || r.cliente.telefono)) || '')}</div></td>
                            <td>${r.created_at ? new Date(r.created_at).toLocaleDateString('es-CO') : '—'}</td>
                            <td>${fmtCOP(r.total_cents)}</td>
                            <td><select onchange="turCambiarEstadoReserva('${r.id}', this.value)">
                                ${['pendiente','pagada','cancelada','cotizada'].map(e => `<option value="${e}"${r.estado===e?' selected':''}>${e[0].toUpperCase()+e.slice(1)}</option>`).join('')}
                            </select></td>
                        </tr>`).join('')}</tbody>
                </table></div>` : '<div class="card"><div class="empty">Aún no hay reservas.</div></div>'}
            `;
        } catch (err) { main.innerHTML = '<div class="empty">Error: ' + esc(err.message) + '</div>'; }
    }

    async function turCambiarEstadoReserva(id, estado) {
        const data = await turismoApi('cambiar_estado_reserva', { proyecto_id: ctx.proyecto_id, reserva_id: id, estado });
        if (!data.ok) { toast('Error: ' + data.error, true); return; }
        toast('Estado actualizado');
    }

    // ── Mobile menu toggle ──
    function toggleMobileMenu(force) {
        const sidebar = document.querySelector('.sidebar');
        const open = typeof force === 'boolean' ? force : !document.body.classList.contains('mobile-menu-open');
        document.body.classList.toggle('mobile-menu-open', open);
        if (sidebar) sidebar.classList.toggle('open', open);
    }

    // Close sidebar on Escape or nav click (mobile)
    document.addEventListener('click', function(e) {
        const navItem = e.target.closest && e.target.closest('.sidebar nav a');
        if (navItem && window.innerWidth <= 768) toggleMobileMenu(false);
    }, true);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') toggleMobileMenu(false);
    });

    // ── PWA Service Worker ──
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const w = reg.installing;
                        w?.addEventListener('statechange', () => {
                            if (w.state === 'installed' && navigator.serviceWorker.controller) {
                                toast('Nueva version disponible — Recarga para actualizar');
                            }
                        });
                    });
                })
                .catch(err => console.warn('[AUVRO SW] Error:', err));
        });
    }

    Object.assign(window, {
        nav, $, toggleMobileMenu, mostrarCarga, ocultarCarga, formProducto, nuevoProducto, editarProducto, eliminarProducto, syncTipo, renderProductos, renderSelector, renderImgs,
        addImg, quitImg, imgSubir, leerArchivo, guardarProducto, formVariaciones, guardarVariaciones,
        renderCategorias, guardarCategoria, eliminarCategoria,
        renderPipeline, guardarEstadoPipeline, eliminarEstadoPipeline,
        renderAtributos, guardarAtributo, eliminarAtributo,
        renderOrdenes, cambiarEstado, renderClientes,
        renderPasarela, guardarPasarela, renderNotificaciones, conectarGmail, desconectarGmail, guardarNotif,
        renderAgentesTienda, guardarAgenteTienda,
        renderDeportes, depNav, depFormDeportista, depGuardarDeportista, depEliminarDeportista,
        depFormPlan, depGuardarPlan, depEliminarPlan, depFormHorario, depGuardarHorario, depEliminarHorario,
        depFormVisoria, depGuardarVisoria, depEliminarVisoria,
        depEstadoInscripcion, depPagarInscripcion,
        depFormTorneo, depGuardarTorneo, depEliminarTorneo,
        depFormNoticia, depGuardarNoticia, depEliminarNoticia,
        depFormGaleria, depGuardarGaleria, depEliminarItemGaleria,
        depSubir, depSubirVarias, depQuitarGaleria,
        renderTurismo, turForm, nuevoProductoTour, turAddTarifa, turAddEscala, turAddExtra, turAddPlantilla, turAddRecogida, turAddTraslado, turStep, turPrev, turNext, turGuardarConfig, turReservas, turCambiarEstadoReserva,
        toggleTheme, actualizarBotonTema
    });

    // Overlay global de carga (anti doble clic). Cada función de Guardar corre
    // bajo esta guardia: overlay visible mientras dura y se oculta al terminar,
    // en toda tienda-admin (productos, categorías, atributos, pasarela, deportes…).
    function mostrarCarga(msg) {
        const el = document.getElementById('carga-overlay');
        if (!el) return;
        el.style.display = 'flex';
        const m = document.getElementById('carga-msg');
        if (m) m.textContent = msg || 'Procesando…';
    }
    function ocultarCarga() {
        const el = document.getElementById('carga-overlay');
        if (el) el.style.display = 'none';
    }
    function instalarGuardiaGuardados() {
        document.addEventListener('click', async function (e) {
            const btn = e.target && e.target.closest ? e.target.closest('button') : null;
            if (!btn) return;
            const onclick = btn.getAttribute('onclick') || '';
            // Solo botones de guardado (guardarProducto, guardarCategoria, depGuardarPlan, etc.).
            if (!/guardar/i.test(onclick)) return;
            const mm = onclick.match(/([A-Za-z_$][\w$]*)\s*\(/);
            const fnName = mm ? mm[1] : '';
            if (!fnName || typeof window[fnName] !== 'function') return;
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarCarga('Guardando…');
            try {
                await window[fnName]();
            } catch (err) {
                console.error('Error en ' + fnName, err);
                try { toast('Error: ' + (err && err.message ? err.message : err), true); } catch (_) {}
            } finally {
                ocultarCarga();
            }
        }, true);
    }

    actualizarBotonTema();
    instalarGuardiaGuardados();
    init();
})();
    </script>
